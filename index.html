<script>
const DATA={"离子反应":{"group":"基础理论","intro":"离子反应是高中化学最基础、也最容易贯穿综合题的一套表达语言。真正要掌握的不是“背离子方程式”，而是判断哪些物质在水溶液中以离子形式存在、哪些必须保留化学式，以及反应为什么能发生。核心驱动力通常是生成难溶物、难电离物质、挥发性物质，或发生氧化还原。高频难点集中在少量/过量、酸式盐、两性氢氧化物以及多步反应的离子方程式书写。","reactions":[{"eq":"H⁺ + OH⁻ → H₂O","name":"强酸强碱中和","type":"离子反应","condition":"水溶液","phenomenon":"放热","ionic":"H⁺ + OH⁻ → H₂O","note":"弱酸弱碱不能简单照搬。","level":"★★★★★"},{"eq":"Ba²⁺ + SO₄²⁻ → BaSO₄↓","name":"硫酸钡沉淀","type":"离子反应","condition":"水溶液","phenomenon":"白色沉淀","ionic":"同式","note":"BaSO₄ 不溶于强酸。","level":"★★★★★"},{"eq":"Ag⁺ + Cl⁻ → AgCl↓","name":"氯化银沉淀","type":"离子反应","condition":"水溶液","phenomenon":"白色沉淀","ionic":"同式","note":"AgCl 可溶于氨水是拓展知识。","level":"★★★★★"},{"eq":"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O","name":"碳酸根与酸","type":"离子反应","condition":"酸足量","phenomenon":"气泡","ionic":"同式","note":"少量 H⁺ 时先生成 HCO₃⁻。","level":"★★★★★"},{"eq":"HCO₃⁻ + H⁺ → CO₂↑ + H₂O","name":"碳酸氢根与酸","type":"离子反应","condition":"常温","phenomenon":"气泡","ionic":"同式","note":"常用于 NaHCO₃ 性质。","level":"★★★★★"},{"eq":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O","name":"铵根与强碱","type":"离子反应","condition":"加热","phenomenon":"产生刺激性气体，使湿润红色石蕊变蓝","ionic":"同式","note":"铵根检验经典反应。","level":"★★★★★"},{"eq":"Ca²⁺ + CO₃²⁻ → CaCO₃↓","name":"碳酸钙沉淀","type":"离子反应","condition":"水溶液","phenomenon":"白色沉淀","ionic":"同式","note":"常用于 CO₃²⁻、Ca²⁺ 相关转化；注意酸性条件下碳酸根不能大量存在。","level":"★★★★★"},{"eq":"Al³⁺ + 3NH₃·H₂O → Al(OH)₃↓ + 3NH₄⁺","name":"Al³⁺ 与氨水","type":"离子反应","condition":"氨水适量或过量","phenomenon":"白色胶状沉淀","ionic":"同式","note":"Al(OH)₃ 不溶于过量氨水；与过量强碱的情况不同。","level":"★★★★★"},{"eq":"Fe³⁺ + 3OH⁻ → Fe(OH)₃↓","name":"Fe³⁺ 与强碱","type":"离子反应","condition":"水溶液","phenomenon":"红褐色沉淀","ionic":"同式","note":"Fe(OH)₃ 不属于两性氢氧化物，不溶于过量 NaOH。","level":"★★★★★"},{"eq":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O","name":"碳酸氢根与强碱","type":"离子反应","condition":"常温","phenomenon":"通常无明显现象","ionic":"同式","note":"HCO₃⁻ 既可与 H⁺ 反应，也可与 OH⁻ 反应。","level":"★★★★★"},{"eq":"Al(OH)₃ + 3H⁺ → Al³⁺ + 3H₂O","name":"氢氧化铝与酸","type":"离子反应","condition":"酸足量","phenomenon":"白色沉淀溶解","ionic":"同式","note":"体现 Al(OH)₃ 的碱性一面。","level":"★★★★★"},{"eq":"Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻","name":"氢氧化铝与强碱","type":"离子反应","condition":"强碱过量","phenomenon":"白色沉淀溶解","ionic":"同式","note":"统一使用 [Al(OH)₄]⁻。","level":"★★★★★"}],"focus":"强弱电解质拆分、离子共存、离子方程式、少量/过量","difficulty":"多步反应与量变、两性体系"},"钠 Na":{"group":"金属元素","intro":"钠（Na，原子序数 11）是典型的碱金属，银白色、质软、密度较小，最外层只有 1 个电子，因此很容易失去电子形成 Na⁺，化学性质活泼。自然界中几乎不存在游离态钠，主要以氯化钠等化合物形式存在。高中阶段要把 Na、Na₂O、Na₂O₂、NaOH、Na₂CO₃、NaHCO₃ 串成一条完整转化链。重点是钠与水、氧气的反应，以及 Na₂O₂ 的强氧化性和供氧性质；Na₂CO₃ 与 NaHCO₃ 的酸反应、热稳定性和量变关系则是高频难点。","reactions":[{"eq":"2Na + 2H₂O → 2NaOH + H₂↑","name":"钠与水","type":"氧化还原","condition":"常温","phenomenon":"浮、熔、游、响；滴有酚酞时溶液变红","ionic":"2Na + 2H₂O → 2Na⁺ + 2OH⁻ + H₂↑","note":"钠必须保存在煤油或石蜡油中；反应剧烈。","level":"★★★★★"},{"eq":"4Na + O₂ → 2Na₂O","name":"钠在较温和条件下与氧气","type":"氧化还原","condition":"常温或较温和条件","phenomenon":"钠表面逐渐失去金属光泽","ionic":"—","note":"条件不同产物不同；燃烧时主要生成 Na₂O₂；高中更常考燃烧生成 Na₂O₂。","level":"★★★★☆"},{"eq":"2Na + O₂ → Na₂O₂","name":"钠在氧气中燃烧","type":"化合 / 氧化还原","condition":"点燃","phenomenon":"黄色火焰，生成淡黄色固体","ionic":"—","note":"产物是过氧化钠，不是 Na₂O。","level":"★★★★★"},{"eq":"2Na + Cl₂ → 2NaCl","name":"钠与氯气","type":"化合 / 氧化还原","condition":"点燃","phenomenon":"剧烈燃烧，生成白色固体","ionic":"—","note":"金属与氯气通常生成高价氯化物（Fe 例外常考）。","level":"★★★★☆"},{"eq":"2Na₂O₂ + 2H₂O → 4NaOH + O₂↑","name":"过氧化钠与水","type":"氧化还原","condition":"常温","phenomenon":"放热并有气泡产生","ionic":"2Na₂O₂ + 2H₂O → 4Na⁺ + 4OH⁻ + O₂↑","note":"Na₂O₂ 既是氧化剂又是还原剂。","level":"★★★★★"},{"eq":"2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂","name":"过氧化钠与二氧化碳","type":"氧化还原","condition":"常温","phenomenon":"固体吸收 CO₂ 并放出 O₂","ionic":"—","note":"用于供氧、潜艇/呼吸面具背景题。","level":"★★★★★"},{"eq":"Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑","name":"碳酸钠与盐酸（足量酸）","type":"复分解","condition":"常温","phenomenon":"有气泡产生","ionic":"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O","note":"若盐酸少量，先生成 HCO₃⁻。","level":"★★★★★"},{"eq":"Na₂CO₃ + HCl → NaCl + NaHCO₃","name":"碳酸钠与少量盐酸","type":"复分解","condition":"盐酸少量","phenomenon":"通常无明显气泡或气泡较少","ionic":"CO₃²⁻ + H⁺ → HCO₃⁻","note":"量的关系是高频易错点。","level":"★★★★★"},{"eq":"NaHCO₃ + HCl → NaCl + H₂O + CO₂↑","name":"碳酸氢钠与盐酸","type":"复分解","condition":"常温","phenomenon":"立即产生气泡","ionic":"HCO₃⁻ + H⁺ → CO₂↑ + H₂O","note":"与同浓度酸反应通常比 Na₂CO₃ 更快放气。","level":"★★★★★"},{"eq":"2NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑","name":"碳酸氢钠受热","type":"分解","condition":"加热","phenomenon":"有水和气体生成","ionic":"—","note":"Na₂CO₃ 受热稳定；这是鉴别二者的重要依据。","level":"★★★★★"},{"eq":"Na₂CO₃ + CO₂ + H₂O → 2NaHCO₃","name":"碳酸钠转化为碳酸氢钠","type":"化合","condition":"通入过量 CO₂","phenomenon":"—","ionic":"CO₃²⁻ + CO₂ + H₂O → 2HCO₃⁻","note":"侯氏制碱及碳酸盐体系常见。","level":"★★★★☆"},{"eq":"Na₂CO₃ + Ca(OH)₂ → CaCO₃↓ + 2NaOH","name":"碳酸钠与石灰水","type":"复分解","condition":"水溶液","phenomenon":"白色沉淀","ionic":"CO₃²⁻ + Ca²⁺ → CaCO₃↓","note":"可联系苛化法与碳酸盐检验。","level":"★★★★☆"},{"eq":"NaHCO₃ + NaOH → Na₂CO₃ + H₂O","name":"碳酸氢钠与强碱","type":"酸碱反应","condition":"常温","phenomenon":"通常无明显现象","ionic":"HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O","note":"HCO₃⁻ 既能与酸反应，也能与强碱反应。","level":"★★★★★"}],"focus":"Na 与水、Na₂O₂、Na₂CO₃/NaHCO₃","difficulty":"碳酸盐量变与实验现象","knowledge":[{"title":"为什么钠这么活泼？","body":"钠原子最外层只有 1 个电子，失去这个电子后可形成稳定的 Na⁺。因此钠的金属性和还原性较强，遇水、氧气、卤素等都容易发生反应。"},{"title":"保存与安全","body":"金属钠通常隔绝空气和水保存。实验取用后剩余钠应按规范处理，不能随意丢入水槽。"}]},"氯 Cl":{"group":"非金属元素","intro":"氯（Cl，原子序数 17）是卤族代表元素，最外层有 7 个电子，容易得到电子形成 Cl⁻。氯气 Cl₂ 是黄绿色、有刺激性气味的有毒气体，具有较强氧化性。高中主线围绕 Cl₂、HCl、HClO、Cl⁻ 展开：氯水涉及多种粒子共存，HClO 与漂白、消毒有关，Cl₂ 与碱的歧化又联系到尾气吸收和漂白粉。实验室制 Cl₂、Cl⁻ 检验、卤素氧化性比较也都是高频内容。","reactions":[{"eq":"2Fe + 3Cl₂ → 2FeCl₃","name":"铁在氯气中燃烧","type":"氧化还原","condition":"点燃","phenomenon":"棕褐色烟","ionic":"—","note":"即使 Fe 过量，氯气与 Fe 通常生成 FeCl₃。","level":"★★★★★"},{"eq":"Cu + Cl₂ → CuCl₂","name":"铜在氯气中燃烧","type":"氧化还原","condition":"点燃","phenomenon":"生成棕黄色烟，固体溶于水呈蓝绿色","ionic":"—","note":"CuCl₂ 固体颜色与水溶液颜色注意区分。","level":"★★★★☆"},{"eq":"H₂ + Cl₂ → 2HCl","name":"氢气与氯气","type":"化合 / 氧化还原","condition":"点燃或光照","phenomenon":"苍白色火焰；强光下可爆炸","ionic":"—","note":"混合气体在强光下爆炸风险高。","level":"★★★★☆"},{"eq":"Cl₂ + H₂O ⇌ HCl + HClO","name":"氯气与水","type":"歧化","condition":"常温","phenomenon":"氯水呈浅黄绿色","ionic":"Cl₂ + H₂O ⇌ H⁺ + Cl⁻ + HClO","note":"氯水含 Cl₂、H₂O、HClO、H⁺、Cl⁻、ClO⁻ 等微粒。","level":"★★★★★"},{"eq":"2HClO → 2HCl + O₂↑","name":"次氯酸分解","type":"分解 / 氧化还原","condition":"光照","phenomenon":"有效氯逐渐降低","ionic":"—","note":"氯水应避光保存。","level":"★★★★★"},{"eq":"Cl₂ + 2NaOH → NaCl + NaClO + H₂O","name":"氯气与冷稀 NaOH","type":"歧化","condition":"冷、稀碱","phenomenon":"氯气颜色消失","ionic":"Cl₂ + 2OH⁻ → Cl⁻ + ClO⁻ + H₂O","note":"尾气吸收常用 NaOH 溶液。","level":"★★★★★"},{"eq":"3Cl₂ + 6KOH → 5KCl + KClO₃ + 3H₂O","name":"氯气与热浓碱","type":"歧化","condition":"热、浓 KOH","phenomenon":"氯气被吸收","ionic":"3Cl₂ + 6OH⁻ → 5Cl⁻ + ClO₃⁻ + 3H₂O","note":"与冷稀碱产物不同。","level":"★★★★☆"},{"eq":"2Cl₂ + 2Ca(OH)₂ → CaCl₂ + Ca(ClO)₂ + 2H₂O","name":"工业制漂白粉","type":"歧化","condition":"氯气通入石灰乳","phenomenon":"—","ionic":"—","note":"漂白粉有效成分为 Ca(ClO)₂。","level":"★★★★★"},{"eq":"Ca(ClO)₂ + CO₂ + H₂O → CaCO₃↓ + 2HClO","name":"漂白粉起效","type":"复分解","condition":"潮湿空气 / CO₂","phenomenon":"产生具有漂白性的 HClO","ionic":"ClO⁻ + H⁺ ⇌ HClO（核心粒子变化）","note":"空气中的 CO₂ 与水提供酸性环境，使 ClO⁻ 转化为 HClO；不要把复杂体系机械拆成唯一离子式。","level":"★★★★★"},{"eq":"MnO₂ + 4HCl(浓) → MnCl₂ + Cl₂↑ + 2H₂O","name":"实验室制氯气","type":"氧化还原","condition":"加热，浓盐酸","phenomenon":"生成黄绿色气体","ionic":"MnO₂ + 4H⁺ + 2Cl⁻ → Mn²⁺ + Cl₂↑ + 2H₂O","note":"稀盐酸通常不能与 MnO₂ 有效制氯气。","level":"★★★★★"},{"eq":"Ag⁺ + Cl⁻ → AgCl↓","name":"氯离子检验","type":"沉淀","condition":"先加稀硝酸，再加 AgNO₃","phenomenon":"白色沉淀","ionic":"Ag⁺ + Cl⁻ → AgCl↓","note":"先酸化是为了排除 CO₃²⁻ 等干扰。","level":"★★★★★"},{"eq":"Cl₂ + 2FeCl₂ → 2FeCl₃","name":"氯气氧化 Fe²⁺","type":"氧化还原","condition":"水溶液","phenomenon":"浅绿色逐渐转黄","ionic":"Cl₂ + 2Fe²⁺ → 2Cl⁻ + 2Fe³⁺","note":"常用于比较 Cl₂ 的氧化性以及 Fe²⁺ 的还原性。","level":"★★★★★"},{"eq":"Cl₂ + 2KI → 2KCl + I₂","name":"氯气置换碘","type":"氧化还原","condition":"水溶液","phenomenon":"生成碘；遇淀粉显蓝色","ionic":"Cl₂ + 2I⁻ → 2Cl⁻ + I₂","note":"卤素氧化性递变的经典反应。","level":"★★★★★"}],"focus":"Cl₂ 氧化性、氯水、HClO、制氯气、Cl⁻ 检验","difficulty":"氯水粒子、歧化、漂白原理","knowledge":[{"title":"氯水为什么复杂？","body":"氯气溶于水后存在 Cl₂、H₂O、HClO、H⁺、Cl⁻、ClO⁻ 等多种粒子，其性质会随光照、放置时间、pH 改变。"},{"title":"漂白的本质","body":"HClO 的漂白通常属于氧化漂白，具有不可逆性；SO₂ 对部分有色物质的漂白机理不同，不能混为一谈。"}]},"铁 Fe":{"group":"金属元素","intro":"铁（Fe，原子序数 26）是最重要的常用金属之一，也是高中“变价金属”体系的代表。最核心的学习主线是 Fe、Fe²⁺、Fe³⁺、Fe(OH)₂、Fe(OH)₃ 之间的相互转化。Fe²⁺ 具有较明显还原性，Fe³⁺ 具有氧化性；不同氧化剂和还原剂可以推动价态变化。实验现象中，Fe(OH)₂ 的颜色变化和 Fe³⁺ 与 SCN⁻ 的显色尤其重要。综合题常把价态、离子方程式、除杂和检验放在一起考查。","reactions":[{"eq":"3Fe + 2O₂ → Fe₃O₄","name":"铁在氧气中燃烧","type":"氧化还原","condition":"点燃","phenomenon":"火星四射，生成黑色固体","ionic":"—","note":"产物通常写 Fe₃O₄，不写 Fe₂O₃。","level":"★★★★★"},{"eq":"Fe + 2HCl → FeCl₂ + H₂↑","name":"铁与盐酸","type":"置换 / 氧化还原","condition":"常温","phenomenon":"产生气泡，溶液呈浅绿色","ionic":"Fe + 2H⁺ → Fe²⁺ + H₂↑","note":"非氧化性酸中生成 Fe²⁺。","level":"★★★★★"},{"eq":"3Fe + 4H₂O(g) → Fe₃O₄ + 4H₂","name":"铁与水蒸气","type":"氧化还原","condition":"高温","phenomenon":"生成黑色固体和氢气","ionic":"—","note":"铁与冷水基本不反应。","level":"★★★★★"},{"eq":"Fe + CuSO₄ → FeSO₄ + Cu","name":"铁置换铜","type":"置换","condition":"常温","phenomenon":"铁表面析出红色铜，蓝色逐渐变浅","ionic":"Fe + Cu²⁺ → Fe²⁺ + Cu","note":"铁单质还原性强于铜。","level":"★★★★☆"},{"eq":"Fe + 2Fe³⁺ → 3Fe²⁺","name":"铁还原 Fe³⁺","type":"氧化还原","condition":"溶液中","phenomenon":"黄色/棕黄色 Fe³⁺溶液颜色变浅","ionic":"Fe + 2Fe³⁺ → 3Fe²⁺","note":"除去 Fe²⁺ 溶液中少量 Fe³⁺ 可加铁粉。","level":"★★★★★"},{"eq":"2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻","name":"Cl₂ 氧化 Fe²⁺","type":"氧化还原","condition":"水溶液","phenomenon":"浅绿色逐渐转黄","ionic":"2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻","note":"Br₂、H₂O₂、KMnO₄ 等也可氧化 Fe²⁺。","level":"★★★★★"},{"eq":"2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂","name":"Fe³⁺ 氧化 I⁻","type":"氧化还原","condition":"水溶液","phenomenon":"溶液出现碘的棕黄色","ionic":"同式","note":"可用于比较氧化性：Fe³⁺ > I₂。","level":"★★★★☆"},{"eq":"Fe²⁺ + 2OH⁻ → Fe(OH)₂↓","name":"生成氢氧化亚铁","type":"沉淀","condition":"隔绝空气效果更明显","phenomenon":"生成白色絮状沉淀，迅速变为灰绿色，最终变为红褐色","ionic":"Fe²⁺ + 2OH⁻ → Fe(OH)₂↓","note":"新制 Fe(OH)₂ 极易被空气中的 O₂ 氧化；实验常通过隔绝空气减缓氧化。","level":"★★★★★"},{"eq":"4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃","name":"氢氧化亚铁被氧化","type":"氧化还原","condition":"空气中","phenomenon":"生成白色絮状沉淀，迅速变为灰绿色，最终变为红褐色","ionic":"—","note":"新制 Fe(OH)₂ 极易被空气中的 O₂ 氧化；实验常通过隔绝空气减缓氧化。","level":"★★★★★"},{"eq":"Fe³⁺ + 3OH⁻ → Fe(OH)₃↓","name":"生成氢氧化铁","type":"沉淀","condition":"常温","phenomenon":"红褐色沉淀","ionic":"同式","note":"Fe(OH)₃ 不溶于过量强碱。","level":"★★★★★"},{"eq":"Fe³⁺ + SCN⁻ ⇌ FeSCN²⁺","name":"Fe³⁺ 显色反应","type":"络合","condition":"酸性或中性溶液","phenomenon":"血红色","ionic":"同式（高中常用简化表示）","note":"实际溶液中可存在多种硫氰合铁(III)配合物；高中定性重点是出现血红色。","level":"★★★★★"},{"eq":"2Fe³⁺ + Cu → 2Fe²⁺ + Cu²⁺","name":"Fe³⁺ 氧化铜","type":"氧化还原","condition":"水溶液","phenomenon":"铜逐渐溶解，Fe³⁺ 特征颜色变浅","ionic":"同式","note":"印刷电路板腐蚀铜可联系这一反应。","level":"★★★★★"},{"eq":"Fe + 2H⁺ → Fe²⁺ + H₂↑","name":"铁与非氧化性酸","type":"氧化还原","condition":"稀盐酸或稀硫酸","phenomenon":"铁溶解并产生气泡","ionic":"同式","note":"与稀的非氧化性酸通常生成 Fe²⁺，不是 Fe³⁺。","level":"★★★★★"}],"focus":"Fe²⁺/Fe³⁺ 转化、氢氧化物、检验","difficulty":"氧化还原离子式与价态判断","knowledge":[{"title":"价态主线","body":"铁化学最重要的是 Fe ⇌ Fe²⁺ ⇌ Fe³⁺。判断转化方向时先看氧化剂、还原剂，再结合反应条件和物质的量。"},{"title":"Fe(OH)₂ 的典型现象","body":"新生成的 Fe(OH)₂ 常描述为白色沉淀，在空气中迅速变为灰绿色，最终被氧化为红褐色 Fe(OH)₃。"}]},"铝 Al":{"group":"金属元素","intro":"铝（Al，原子序数 13）是典型的轻金属。虽然金属性较强，但常温下表面会形成致密氧化膜，因此实际耐腐蚀性较好。高中阶段铝体系最大的特点是“两性”，核心转化是 Al³⁺ ⇌ Al(OH)₃ ⇌ [Al(OH)₄]⁻。Al₂O₃、Al(OH)₃ 能与酸反应，也能与强碱体系反应。难点在于酸碱加入量不同导致沉淀生成、继续溶解或最终转化，以及铝单质与强碱反应的配平。","reactions":[{"eq":"4Al + 3O₂ → 2Al₂O₃","name":"铝与氧气","type":"氧化还原","condition":"加热 / 点燃","phenomenon":"铝箔燃烧发出强光（条件合适）","ionic":"—","note":"常温铝表面有致密氧化膜保护。","level":"★★★★☆"},{"eq":"2Al + 6HCl → 2AlCl₃ + 3H₂↑","name":"铝与盐酸","type":"氧化还原","condition":"常温，氧化膜破坏后","phenomenon":"产生大量气泡","ionic":"2Al + 6H⁺ → 2Al³⁺ + 3H₂↑","note":"铝在冷浓硫酸、冷浓硝酸中钝化。","level":"★★★★★"},{"eq":"2Al + 2NaOH + 6H₂O → 2Na[Al(OH)₄] + 3H₂↑","name":"铝与强碱","type":"氧化还原","condition":"强碱溶液","phenomenon":"铝逐渐溶解并放出气体","ionic":"2Al + 2OH⁻ + 6H₂O → 2[Al(OH)₄]⁻ + 3H₂↑","note":"采用新教材常见四羟基合铝酸根 [Al(OH)₄]⁻ 写法。","level":"★★★★★"},{"eq":"2Al + Fe₂O₃ → Al₂O₃ + 2Fe","name":"铝热反应","type":"置换 / 氧化还原","condition":"高温点燃，常用 Mg 条引燃","phenomenon":"放出大量热，熔融铁生成","ionic":"—","note":"用于焊接钢轨、冶炼难熔金属背景题。","level":"★★★★★"},{"eq":"Al₂O₃ + 6H⁺ → 2Al³⁺ + 3H₂O","name":"氧化铝与酸","type":"酸碱反应","condition":"酸性","phenomenon":"白色固体溶解","ionic":"同式","note":"体现 Al₂O₃ 两性。","level":"★★★★★"},{"eq":"Al₂O₃ + 2NaOH + 3H₂O → 2Na[Al(OH)₄]","name":"氧化铝与碱","type":"酸碱反应","condition":"强碱","phenomenon":"白色固体溶解","ionic":"Al₂O₃ + 2OH⁻ + 3H₂O → 2[Al(OH)₄]⁻","note":"采用 [Al(OH)₄]⁻，不再使用旧式 AlO₂⁻ 作为本网页主写法。","level":"★★★★★"},{"eq":"Al³⁺ + 3OH⁻ → Al(OH)₃↓","name":"Al³⁺ 与少量碱","type":"沉淀","condition":"OH⁻ 适量","phenomenon":"白色胶状沉淀","ionic":"同式","note":"过量强碱会使沉淀溶解。","level":"★★★★★"},{"eq":"Al(OH)₃ + NaOH → Na[Al(OH)₄]","name":"氢氧化铝与过量碱","type":"酸碱反应","condition":"强碱过量","phenomenon":"白色沉淀溶解","ionic":"Al(OH)₃ + OH⁻ → [Al(OH)₄]⁻","note":"新教材常见写法：生成四羟基合铝酸根。","level":"★★★★★"},{"eq":"Al(OH)₃ + 3H⁺ → Al³⁺ + 3H₂O","name":"氢氧化铝与酸","type":"酸碱反应","condition":"酸性","phenomenon":"白色沉淀溶解","ionic":"同式","note":"体现 Al(OH)₃ 两性。","level":"★★★★★"},{"eq":"[Al(OH)₄]⁻ + H⁺ → Al(OH)₃↓ + H₂O","name":"铝酸根与少量酸","type":"复分解","condition":"H⁺ 少量","phenomenon":"生成白色胶状沉淀","ionic":"[Al(OH)₄]⁻ + H⁺ → Al(OH)₃↓ + H₂O","note":"继续加入过量酸：Al(OH)₃ + 3H⁺ → Al³⁺ + 3H₂O。","level":"★★★★★"},{"eq":"[Al(OH)₄]⁻ + 4H⁺ → Al³⁺ + 4H₂O","name":"四羟基合铝酸根与过量酸","type":"酸碱反应","condition":"H⁺ 过量","phenomenon":"若先形成 Al(OH)₃ 白色胶状沉淀，继续加酸后沉淀溶解","ionic":"[Al(OH)₄]⁻ + 4H⁺ → Al³⁺ + 4H₂O","note":"少量酸与过量酸的产物不同，是铝体系高频题。","level":"★★★★★"},{"eq":"Al³⁺ + 3NH₃·H₂O → Al(OH)₃↓ + 3NH₄⁺","name":"铝盐与氨水","type":"复分解","condition":"常温","phenomenon":"白色胶状沉淀","ionic":"同式","note":"过量氨水不能溶解 Al(OH)₃，是与强碱鉴别的重要点。","level":"★★★★★"},{"eq":"[Al(OH)₄]⁻ + CO₂ → Al(OH)₃↓ + HCO₃⁻","name":"偏铝酸体系通入 CO₂","type":"复分解","condition":"CO₂ 适量","phenomenon":"白色胶状沉淀","ionic":"同式","note":"CO₂ 提供酸性使 [Al(OH)₄]⁻ 转化为 Al(OH)₃；具体碳酸物种随条件变化。","level":"★★★★☆"},{"eq":"2Al + 6H⁺ → 2Al³⁺ + 3H₂↑","name":"铝与非氧化性酸","type":"氧化还原","condition":"酸足量，氧化膜被破坏","phenomenon":"铝溶解并产生气泡","ionic":"同式","note":"先考虑表面氧化膜；浓硝酸、浓硫酸常温下存在钝化现象。","level":"★★★★★"},{"eq":"Al³⁺ + 4OH⁻ → [Al(OH)₄]⁻","name":"Al³⁺ 与过量强碱","type":"离子反应","condition":"OH⁻ 过量","phenomenon":"先有白色沉淀后溶解","ionic":"同式","note":"可理解为先生成 Al(OH)₃，再与 OH⁻ 反应。","level":"★★★★★"}],"focus":"两性、Al³⁺/Al(OH)₃/[Al(OH)₄]⁻","difficulty":"酸碱用量与分步转化","knowledge":[{"title":"铝的保护膜","body":"铝虽然较活泼，但常温下表面形成致密 Al₂O₃ 膜，因此具有一定耐腐蚀性。酸、碱或特定条件可破坏保护膜。"},{"title":"两性不是“两边都一样”","body":"Al(OH)₃ 与强酸反应形成 Al³⁺，与强碱反应形成 [Al(OH)₄]⁻；试剂强弱和加入量都会影响最终产物。"}]},"硫 S":{"group":"非金属元素","intro":"硫元素常见价态 −2、0、+4、+6。核心是 H₂S、SO₂、SO₃、H₂SO₄ 及浓硫酸强氧化性。","reactions":[{"eq":"S + O₂ → SO₂","name":"硫燃烧","type":"氧化还原","condition":"点燃","phenomenon":"空气中淡蓝色火焰，生成有刺激性气味气体","ionic":"—","note":"通常生成 SO₂ 而非 SO₃。","level":"★★★★★"},{"eq":"2H₂S + SO₂ → 3S↓ + 2H₂O","name":"硫化氢与二氧化硫","type":"归中 / 氧化还原","condition":"常温","phenomenon":"生成淡黄色硫沉淀","ionic":"同式","note":"−2 价与 +4 价归中到 0 价。","level":"★★★★★"},{"eq":"SO₂ + H₂O ⇌ H⁺ + HSO₃⁻","name":"SO₂ 溶于水的酸性平衡","type":"酸碱平衡","condition":"水溶液","phenomenon":"溶液呈酸性","ionic":"同式","note":"高中资料有时用 H₂SO₃ 作形式化简写；更严谨地说，水中主要讨论溶解 SO₂ 与 HSO₃⁻、SO₃²⁻ 等平衡。","level":"★★★★☆"},{"eq":"SO₂ + 2NaOH → Na₂SO₃ + H₂O","name":"SO₂ 与足量 NaOH","type":"复分解","condition":"NaOH 足量","phenomenon":"SO₂ 被吸收","ionic":"SO₂ + 2OH⁻ → SO₃²⁻ + H₂O","note":"SO₂ 尾气可用碱液吸收。","level":"★★★★★"},{"eq":"SO₂ + NaOH → NaHSO₃","name":"SO₂ 与少量 NaOH","type":"化合","condition":"NaOH 少量 / SO₂ 过量","phenomenon":"SO₂ 被吸收","ionic":"SO₂ + OH⁻ → HSO₃⁻","note":"注意少量/过量关系。","level":"★★★★★"},{"eq":"2SO₂ + O₂ ⇌ 2SO₃","name":"二氧化硫催化氧化","type":"可逆 / 氧化还原","condition":"催化剂、适宜温度","phenomenon":"工业过程通常无肉眼明显现象","ionic":"—","note":"接触法制硫酸的重要步骤，同时可联系化学平衡；接触法制硫酸核心反应。","level":"★★★★★"},{"eq":"Cu + 2H₂SO₄(浓) → CuSO₄ + SO₂↑ + 2H₂O","name":"铜与浓硫酸","type":"氧化还原","condition":"加热，浓硫酸","phenomenon":"铜溶解，产生有刺激性气味气体","ionic":"—","note":"浓硫酸体系通常直接掌握分子方程式；不宜机械套用稀溶液离子方程式。浓硫酸体现强氧化性；冷浓硫酸与 Cu 反应很慢；浓硫酸是氧化剂。","level":"★★★★★"},{"eq":"C + 2H₂SO₄(浓) → CO₂↑ + 2SO₂↑ + 2H₂O","name":"碳与浓硫酸","type":"氧化还原","condition":"加热，浓硫酸","phenomenon":"生成两种气体","ionic":"—","note":"检验混合气体时要考虑 SO₂ 对后续检验的干扰；体现浓硫酸强氧化性。","level":"★★★★☆"},{"eq":"SO₂ + Br₂ + 2H₂O → H₂SO₄ + 2HBr","name":"SO₂ 使溴水褪色","type":"氧化还原","condition":"水溶液","phenomenon":"溴水褪色","ionic":"SO₂ + Br₂ + 2H₂O → SO₄²⁻ + 4H⁺ + 2Br⁻","note":"这是还原性导致褪色，不是漂白性。","level":"★★★★★"},{"eq":"Ba²⁺ + SO₄²⁻ → BaSO₄↓","name":"硫酸根检验","type":"沉淀","condition":"先加稀盐酸酸化，再加 BaCl₂","phenomenon":"白色沉淀","ionic":"同式","note":"先酸化排除 CO₃²⁻、SO₃²⁻ 等干扰。","level":"★★★★★"},{"eq":"SO₂ + Cl₂ + 2H₂O → H₂SO₄ + 2HCl","name":"SO₂ 使氯水褪色","type":"氧化还原","condition":"水溶液","phenomenon":"氯水颜色褪去","ionic":"SO₂ + Cl₂ + 2H₂O → SO₄²⁻ + 4H⁺ + 2Cl⁻","note":"体现 SO₂ 的还原性，不属于 SO₂ 的漂白作用。","level":"★★★★★"},{"eq":"SO₂ + 2H₂S → 3S↓ + 2H₂O","name":"SO₂ 与 H₂S","type":"氧化还原","condition":"常温","phenomenon":"生成黄色硫沉淀","ionic":"同式","note":"同一元素不同价态发生归中反应，是氧化还原高频模型。","level":"★★★★★"},{"eq":"Ba²⁺ + SO₃²⁻ → BaSO₃↓","name":"亚硫酸钡沉淀","type":"沉淀反应","condition":"水溶液","phenomenon":"白色沉淀","ionic":"同式","note":"BaSO₃ 可溶于强酸并放出 SO₂，与 BaSO₄ 区分。","level":"★★★★☆"},{"eq":"2SO₂ + O₂ + 2H₂O → 2H₂SO₄","name":"SO₂ 在空气和水中最终氧化","type":"氧化反应","condition":"空气、潮湿环境","phenomenon":"—","ionic":"—","note":"这是理解酸雨形成的简化总体反应；实际大气过程包含多步氧化和溶解平衡。","level":"★★★★☆"}],"focus":"SO₂、浓硫酸、硫酸工业","difficulty":"SO₂ 漂白/还原性区分与氧化还原","knowledge":[{"title":"SO₂ 的两面性","body":"SO₂ 中 S 为 +4 价，既可被氧化到 +6 价，也可被还原到 0 或更低价，因此在不同反应中可表现还原性或氧化性。"},{"title":"SO₂ 漂白","body":"SO₂ 对某些有色物质的漂白通常与可逆结合有关，不等同于 HClO、O₃ 等强氧化剂造成的氧化漂白。"}]},"氮 N":{"group":"非金属元素","intro":"氮元素价态变化丰富。重点包括 N₂、NH₃、NH₄⁺、NO、NO₂、HNO₃ 以及氨的实验室制法和硝酸强氧化性。","reactions":[{"eq":"N₂ + 3H₂ ⇌ 2NH₃","name":"合成氨","type":"可逆氧化还原","condition":"高温、高压、铁催化剂","phenomenon":"—","ionic":"—","note":"工业条件与平衡移动综合题高频。","level":"★★★★★"},{"eq":"N₂ + O₂ ⇌ 2NO","name":"氮气与氧气","type":"氧化还原","condition":"高温或放电","phenomenon":"生成无色 NO","ionic":"—","note":"汽车尾气、雷雨固氮背景常见。","level":"★★★★☆"},{"eq":"2NO + O₂ → 2NO₂","name":"NO 氧化","type":"氧化还原","condition":"常温","phenomenon":"无色气体迅速变红棕色","ionic":"—","note":"NO 不能直接用排空气法根据颜色判断纯度；NO 与空气接触不能长期共存。","level":"★★★★★"},{"eq":"3NO₂ + H₂O → 2HNO₃ + NO","name":"NO₂ 与水","type":"歧化","condition":"常温","phenomenon":"红棕色逐渐变浅，同时有无色 NO 生成","ionic":"3NO₂ + H₂O → 2H⁺ + 2NO₃⁻ + NO","note":"吸收 NO₂ 时通 O₂ 可提高吸收率。","level":"★★★★★"},{"eq":"4NO₂ + O₂ + 2H₂O → 4HNO₃","name":"NO₂、O₂ 与水总体反应","type":"氧化还原","condition":"有 O₂ 和水","phenomenon":"红棕色逐渐消失","ionic":"—","note":"可联系 NO₂ 被水吸收时补充 O₂ 提高吸收率；工业尾气处理常用。","level":"★★★★☆"},{"eq":"NH₃ + HCl → NH₄Cl","name":"氨与氯化氢","type":"化合","condition":"常温","phenomenon":"生成大量白烟","ionic":"NH₃ + H⁺ → NH₄⁺","note":"用于检验 NH₃ 或 HCl 气体的经典现象。","level":"★★★★★"},{"eq":"4NH₃ + 5O₂ → 4NO + 6H₂O","name":"氨的催化氧化","type":"氧化还原","condition":"催化剂、加热","phenomenon":"生成无色 NO，遇空气进一步变红棕色","ionic":"—","note":"硝酸工业的重要步骤；硝酸工业第一步。","level":"★★★★★"},{"eq":"2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃↑ + 2H₂O","name":"实验室制氨气","type":"复分解","condition":"加热固体混合物","phenomenon":"产生有刺激性气味气体","ionic":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O","note":"不能用 NaOH 固体代替石灰? 可反应但实验室常用 Ca(OH)₂，便于操作。","level":"★★★★★"},{"eq":"Cu + 4HNO₃(浓) → Cu(NO₃)₂ + 2NO₂↑ + 2H₂O","name":"铜与浓硝酸","type":"氧化还原","condition":"浓硝酸","phenomenon":"铜溶解，产生红棕色气体，溶液变蓝","ionic":"Cu + 4H⁺ + 2NO₃⁻ → Cu²⁺ + 2NO₂↑ + 2H₂O","note":"浓硝酸主要还原产物 NO₂。","level":"★★★★★"},{"eq":"3Cu + 8HNO₃(稀) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O","name":"铜与稀硝酸","type":"氧化还原","condition":"稀硝酸","phenomenon":"生成无色气体，遇空气变红棕","ionic":"3Cu + 8H⁺ + 2NO₃⁻ → 3Cu²⁺ + 2NO↑ + 4H₂O","note":"稀硝酸主要还原产物常写 NO。","level":"★★★★★"},{"eq":"NH₄HCO₃ → NH₃↑ + CO₂↑ + H₂O","name":"碳酸氢铵受热","type":"分解","condition":"加热","phenomenon":"产生两种气体","ionic":"—","note":"铵盐受热规律不能一概而论，要按具体盐判断。","level":"★★★★☆"},{"eq":"NH₃ + H₂O ⇌ NH₄⁺ + OH⁻","name":"氨溶于水","type":"可逆反应","condition":"常温","phenomenon":"氨极易溶于水，溶液呈碱性","ionic":"同式","note":"高中常用该总式表示氨在水中的弱碱性平衡；不要把 NH₃·H₂O 当作强电解质拆分。","level":"★★★★☆"},{"eq":"NH₃·H₂O + H⁺ → NH₄⁺ + H₂O","name":"氨水与酸","type":"酸碱反应","condition":"常温","phenomenon":"通常无明显现象","ionic":"同式","note":"弱碱 NH₃·H₂O 在离子方程式中不能拆。","level":"★★★★★"},{"eq":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O","name":"铵根与强碱","type":"离子反应","condition":"加热","phenomenon":"产生刺激性气味气体，湿润红色石蕊试纸变蓝","ionic":"同式","note":"铵根检验的核心离子方程式。","level":"★★★★★"}],"focus":"NH₃、铵盐、NOₓ、HNO₃","difficulty":"硝酸氧化还原与多价态转化","knowledge":[{"title":"氮元素价态主线","body":"N₂、NH₃、NO、NO₂、HNO₃ 构成高中最重要的氮元素转化链。做题时先标 N 的化合价，再判断氧化还原方向。"},{"title":"硝酸的氧化性","body":"硝酸既表现酸性又可能表现强氧化性。与金属反应时产物受酸浓度、金属种类和条件影响，通常不能简单套用“酸 + 金属 → H₂”。"}]},"碳 C / 硅 Si":{"group":"非金属元素","intro":"无机部分重点包括 CO/CO₂、碳酸盐、硅、SiO₂ 和硅酸盐；同时碳是有机化学的核心元素。","reactions":[{"eq":"C + O₂ → CO₂","name":"碳完全燃烧","type":"氧化还原","condition":"氧气充足，点燃","phenomenon":"放热","ionic":"—","note":"氧气不足时可能生成 CO。","level":"★★★★☆"},{"eq":"2C + O₂ → 2CO","name":"碳不完全燃烧","type":"氧化还原","condition":"氧气不足，点燃","phenomenon":"—","ionic":"—","note":"CO 有毒。","level":"★★★★☆"},{"eq":"CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O","name":"CO₂ 通入石灰水","type":"复分解","condition":"CO₂ 适量","phenomenon":"溶液变浑浊","ionic":"CO₂ + Ca²⁺ + 2OH⁻ → CaCO₃↓ + H₂O","note":"过量 CO₂ 会使沉淀重新溶解；CO₂ 过量时沉淀可继续溶解。","level":"★★★★★"},{"eq":"CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂","name":"过量 CO₂ 使 CaCO₃ 溶解","type":"化合","condition":"CO₂ 过量","phenomenon":"浑浊逐渐消失","ionic":"CaCO₃ + CO₂ + H₂O → Ca²⁺ + 2HCO₃⁻","note":"CO₂ 鉴别题中注意“先浑浊后澄清”。","level":"★★★★★"},{"eq":"CO + CuO → Cu + CO₂","name":"CO 还原氧化铜","type":"氧化还原","condition":"加热","phenomenon":"黑色 CuO 逐渐变红","ionic":"—","note":"CO 有毒，实验尾气必须处理；尾气 CO 需处理。","level":"★★★★☆"},{"eq":"3CO + Fe₂O₃ → 2Fe + 3CO₂","name":"CO 还原 Fe₂O₃","type":"氧化还原","condition":"高温","phenomenon":"红棕色固体逐渐变黑/生成铁","ionic":"—","note":"高炉炼铁背景高频。","level":"★★★★★"},{"eq":"Si + O₂ → SiO₂","name":"硅燃烧","type":"氧化还原","condition":"加热","phenomenon":"生成白色固体","ionic":"—","note":"Si 在常温下较稳定。","level":"★★★☆☆"},{"eq":"SiO₂ + 2NaOH → Na₂SiO₃ + H₂O","name":"二氧化硅与强碱","type":"复分解","condition":"加热或强碱条件","phenomenon":"固体逐渐溶解","ionic":"SiO₂ + 2OH⁻ → SiO₃²⁻ + H₂O","note":"玻璃器皿长期不能盛强碱。","level":"★★★★★"},{"eq":"SiO₂ + 4HF → SiF₄↑ + 2H₂O","name":"二氧化硅与氢氟酸","type":"特殊反应","condition":"常温","phenomenon":"玻璃被腐蚀","ionic":"—","note":"HF 可刻蚀玻璃，不能用玻璃瓶保存。","level":"★★★★★"},{"eq":"Na₂SiO₃ + 2HCl → H₂SiO₃↓ + 2NaCl","name":"硅酸盐制硅酸","type":"复分解","condition":"常温","phenomenon":"生成白色胶状沉淀","ionic":"SiO₃²⁻ + 2H⁺ → H₂SiO₃↓","note":"硅酸是弱酸，常以胶状沉淀形式出现。","level":"★★★★☆"},{"eq":"CO₂ + OH⁻ → HCO₃⁻","name":"CO₂ 与少量 OH⁻","type":"酸碱反应","condition":"CO₂ 过量","phenomenon":"通常无明显现象","ionic":"同式","note":"OH⁻ 不足时主要生成 HCO₃⁻。","level":"★★★★★"},{"eq":"CO₂ + 2OH⁻ → CO₃²⁻ + H₂O","name":"CO₂ 与足量 OH⁻","type":"酸碱反应","condition":"OH⁻ 过量","phenomenon":"通常无明显现象","ionic":"同式","note":"与上一反应构成典型少量/过量题。","level":"★★★★★"},{"eq":"C + CO₂ → 2CO","name":"碳还原二氧化碳","type":"氧化还原","condition":"高温","phenomenon":"生成 CO","ionic":"—","note":"高炉炼铁中 CO 的形成可联系该反应。","level":"★★★★☆"},{"eq":"Si + 2Cl₂ → SiCl₄","name":"硅与氯气","type":"氧化还原","condition":"加热","phenomenon":"生成 SiCl₄","ionic":"—","note":"可联系高纯硅制备流程中的含硅中间体。","level":"★★★☆☆"}],"knowledge":[{"title":"CO₂ 的量变","body":"CO₂ 通入碱液时，少量和过量可能分别生成 CO₃²⁻ 与 HCO₃⁻；通入石灰水也会出现先沉淀后溶解等量变现象。"},{"title":"硅与硅酸盐","body":"SiO₂ 是酸性氧化物但不溶于水；硅酸盐材料与玻璃、水泥、陶瓷等无机非金属材料密切相关。"}]},"常见气体制备与检验":{"group":"实验化学","intro":"汇总高中常见气体的实验室制法、检验、净化和尾气处理，是实验大题的高频区域。","reactions":[{"eq":"2H₂O₂ → 2H₂O + O₂↑","name":"实验室制氧气","type":"分解","condition":"MnO₂ 催化，常温","phenomenon":"大量气泡；O₂使带火星木条复燃","ionic":"—","note":"MnO₂ 是催化剂；不需要加热，便于控制速率。","level":"★★★★★"},{"eq":"2KClO₃ → 2KCl + 3O₂↑","name":"氯酸钾制氧气","type":"分解","condition":"MnO₂ 催化，加热","phenomenon":"放出 O₂","ionic":"—","note":"实验室老教材常见。","level":"★★★☆☆"},{"eq":"CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑","name":"实验室制二氧化碳","type":"复分解","condition":"大理石/石灰石 + 稀盐酸","phenomenon":"持续产生气泡","ionic":"CaCO₃ + 2H⁺ → Ca²⁺ + CO₂↑ + H₂O","note":"不用 Na₂CO₃ 粉末因反应过快；不用 H₂SO₄ 因 CaSO₄ 覆盖。","level":"★★★★★"},{"eq":"Zn + H₂SO₄(稀) → ZnSO₄ + H₂↑","name":"实验室制 H₂","type":"置换 / 氧化还原","condition":"稀硫酸","phenomenon":"产生无色气泡","ionic":"Zn + 2H⁺ → Zn²⁺ + H₂↑","note":"点燃 H₂ 前必须先检验纯度；点燃前必须验纯。","level":"★★★★★"},{"eq":"CaCO₃ + 2HCl → CaCl₂ + CO₂↑ + H₂O","name":"实验室制 CO₂","type":"复分解","condition":"稀盐酸、块状大理石或石灰石","phenomenon":"持续产生无色气泡","ionic":"CaCO₃ + 2H⁺ → Ca²⁺ + CO₂↑ + H₂O","note":"通常不用稀硫酸，避免生成微溶 CaSO₄ 覆盖固体表面。","level":"★★★★★"},{"eq":"2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃↑ + 2H₂O","name":"实验室制 NH₃","type":"复分解","condition":"固体混合加热","phenomenon":"产生有刺激性气味的气体","ionic":"—","note":"NH₃ 极易溶于水，通常不能用排水法收集。","level":"★★★★★"}],"knowledge":[{"title":"发生装置怎么选","body":"反应物状态和反应条件决定发生装置：固固加热、固液加热、固液不加热的装置选择不同。"},{"title":"收集方法怎么选","body":"排水法适合难溶或不易与水反应的气体；向上或向下排空气法取决于气体相对空气密度以及是否与空气明显反应。"},{"title":"净化与干燥","body":"净化剂要除去杂质但不能消耗目标气体；干燥剂也不能与目标气体发生反应。装置顺序通常先净化、再干燥。"}],"focus":"O₂、H₂、CO₂、NH₃、Cl₂ 等气体的制备、净化、收集和检验","difficulty":"装置选择、除杂顺序、尾气处理与防倒吸"},"化学平衡 / 水溶液":{"group":"基础理论","intro":"这一部分是选择性必修《化学反应原理》的核心。需要把“动态平衡”作为统一思想：可逆反应达到平衡后正逆反应仍在进行；弱电解质电离、盐类水解和沉淀溶解也都属于平衡体系。重点是平衡移动、pH、弱酸弱碱、电离常数、水解和 Ksp；难点是把浓度变化、平衡移动方向和最终物理量变化区分开。","reactions":[{"eq":"CH₃COOH ⇌ CH₃COO⁻ + H⁺","name":"乙酸电离","type":"弱电解质电离","condition":"水溶液","phenomenon":"—","ionic":"同式","note":"弱酸使用可逆号。","level":"★★★★★"},{"eq":"NH₃·H₂O ⇌ NH₄⁺ + OH⁻","name":"一水合氨电离","type":"弱电解质电离","condition":"水溶液","phenomenon":"—","ionic":"同式","note":"弱碱使用可逆号。","level":"★★★★★"},{"eq":"CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻","name":"醋酸根水解","type":"盐类水解","condition":"水溶液","phenomenon":"溶液呈碱性","ionic":"同式","note":"弱酸强碱盐的阴离子水解；弱酸强碱盐水解。","level":"★★★★★"},{"eq":"NH₄⁺ + H₂O ⇌ NH₃·H₂O + H⁺","name":"铵根水解","type":"盐类水解","condition":"水溶液","phenomenon":"溶液显酸性","ionic":"同式","note":"强酸弱碱盐水解。","level":"★★★★★"},{"eq":"2H₂O ⇌ H₃O⁺ + OH⁻","name":"水的自偶电离","type":"电离平衡","condition":"水溶液","phenomenon":"—","ionic":"也常简写 H₂O ⇌ H⁺ + OH⁻","note":"25℃ 时 Kw = 1.0×10⁻¹⁴（教材常用）。","level":"★★★★★"},{"eq":"CH₃COOH ⇌ H⁺ + CH₃COO⁻","name":"醋酸电离","type":"弱电解质电离","condition":"水溶液","phenomenon":"无明显现象","ionic":"同式","note":"弱酸用可逆符号；稀释促进电离但溶液中 H⁺ 浓度通常下降。","level":"★★★★★"},{"eq":"AgCl(s) ⇌ Ag⁺ + Cl⁻","name":"AgCl 沉淀溶解平衡","type":"沉淀溶解平衡","condition":"饱和溶液","phenomenon":"宏观上沉淀与离子动态平衡","ionic":"同式","note":"Ksp 只与温度有关；加同离子通常使溶解度下降。","level":"★★★★★"},{"eq":"H₂CO₃ ⇌ H⁺ + HCO₃⁻","name":"碳酸第一步电离","type":"弱电解质电离","condition":"水溶液","phenomenon":"—","ionic":"同式","note":"多元弱酸分步电离，以第一步为主。","level":"★★★★☆"},{"eq":"HCO₃⁻ ⇌ H⁺ + CO₃²⁻","name":"碳酸氢根继续电离","type":"弱电解质电离","condition":"水溶液","phenomenon":"—","ionic":"同式","note":"HCO₃⁻ 还可发生水解，具有两性。","level":"★★★★☆"},{"eq":"Fe³⁺ + 3H₂O ⇌ Fe(OH)₃ + 3H⁺","name":"Fe³⁺ 水解示意","type":"盐类水解","condition":"水溶液","phenomenon":"溶液呈酸性；条件合适可出现浑浊","ionic":"同式","note":"水解通常分步，教材中常用总式示意。","level":"★★★★☆"},{"eq":"CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻","name":"碳酸根水解","type":"盐类水解","condition":"水溶液","phenomenon":"溶液呈碱性","ionic":"同式","note":"CO₃²⁻ 的水解程度大于 HCO₃⁻；水解与电离、酸碱反应可能形成多平衡体系。","level":"★★★★★"},{"eq":"Ag⁺ + Cl⁻ ⇌ AgCl(s)","name":"AgCl 沉淀生成与溶解","type":"沉淀溶解平衡","condition":"水溶液","phenomenon":"白色沉淀","ionic":"同式","note":"与 AgCl(s) ⇌ Ag⁺ + Cl⁻ 是同一平衡的两个书写方向。","level":"★★★★★"},{"eq":"Mg(OH)₂(s) ⇌ Mg²⁺ + 2OH⁻","name":"氢氧化镁溶解平衡","type":"沉淀溶解平衡","condition":"饱和溶液","phenomenon":"宏观上存在固体与离子动态平衡","ionic":"同式","note":"加入酸消耗 OH⁻ 可促进沉淀溶解。","level":"★★★★☆"}],"focus":"平衡移动、弱电解质、pH、水解、Ksp","difficulty":"多平衡耦合与定量判断","knowledge":[{"title":"平衡移动 ≠ 平衡常数改变","body":"温度一定时，改变浓度或压强可以使平衡移动，但平衡常数 K 不变；只有温度变化才会改变给定反应的 K。"},{"title":"pH 的核心","body":"pH = -lg c(H⁺)。计算弱酸、弱碱、盐水解和混合体系时，要先确定主要反应和平衡，再判断是否可以作近似。"}]},"电化学":{"group":"基础理论","intro":"电化学把氧化还原反应与电能联系起来。原电池中自发氧化还原反应把化学能转化为电能，负极发生氧化、正极发生还原；电解池则依靠外加电源推动非自发反应，阳极氧化、阴极还原。高频难点是电极判断、电极反应式、离子迁移、放电顺序、电子守恒以及电解前后溶液组成变化。","reactions":[{"eq":"2H⁺ + 2e⁻ → H₂↑","name":"酸性条件析氢","type":"电极反应","condition":"阴极 / 正极还原","phenomenon":"电极产生气泡","ionic":"同式","note":"根据溶液和电极材料判断是否优先析氢。","level":"★★★★★"},{"eq":"Cu²⁺ + 2e⁻ → Cu","name":"铜离子析铜","type":"电极反应","condition":"阴极还原","phenomenon":"电极表面析出红色铜","ionic":"同式","note":"电解 CuSO₄、铜精炼等常见；正极发生还原；电解精炼与电镀都要注意电极材料和电解液。","level":"★★★★★"},{"eq":"4OH⁻ → O₂↑ + 2H₂O + 4e⁻","name":"碱性条件析氧","type":"电极反应","condition":"惰性阳极","phenomenon":"产生无色气体，能使带火星木条复燃","ionic":"同式","note":"也可根据酸性条件写 2H₂O − 4e⁻ → O₂ + 4H⁺。","level":"★★★★☆"},{"eq":"2Cl⁻ → Cl₂↑ + 2e⁻","name":"氯碱工业阳极反应","type":"电极反应","condition":"电解饱和食盐水，惰性阳极","phenomenon":"阳极产生黄绿色气体","ionic":"同式","note":"阳极发生氧化反应。","level":"★★★★★"},{"eq":"2H₂O + 2e⁻ → H₂↑ + 2OH⁻","name":"氯碱工业阴极反应","type":"电极反应","condition":"电解饱和食盐水","phenomenon":"阴极产生无色气体，附近碱性增强","ionic":"同式","note":"水得电子而不是 Na⁺ 析出金属钠。","level":"★★★★★"},{"eq":"2NaCl + 2H₂O → 2NaOH + H₂↑ + Cl₂↑","name":"电解饱和食盐水总反应","type":"电解反应","condition":"通电、离子交换膜工业条件","phenomenon":"两极分别产生 H₂ 和 Cl₂","ionic":"2Cl⁻ + 2H₂O → 2OH⁻ + H₂↑ + Cl₂↑","note":"注意阴阳极产物和离子迁移方向。","level":"★★★★★"},{"eq":"Zn → Zn²⁺ + 2e⁻","name":"锌铜原电池负极","type":"电极反应","condition":"Zn-Cu 原电池","phenomenon":"锌逐渐溶解","ionic":"同式","note":"负极氧化，电子从 Zn 电极流出。","level":"★★★★★"},{"eq":"2H₂O → O₂↑ + 4H⁺ + 4e⁻","name":"水在惰性阳极放氧","type":"电极反应","condition":"水溶液、惰性阳极","phenomenon":"产生 O₂","ionic":"同式","note":"在某些无易放电阴离子的体系中常见。","level":"★★★★★"},{"eq":"Fe → Fe²⁺ + 2e⁻","name":"钢铁吸氧腐蚀负极","type":"电极反应","condition":"潮湿、中性或弱碱性环境","phenomenon":"铁逐渐被腐蚀","ionic":"同式","note":"负极写最简半反应即可；若与正极统一电子数，可整体乘 2。","level":"★★★★★"},{"eq":"O₂ + 2H₂O + 4e⁻ → 4OH⁻","name":"碱性氢氧燃料电池正极","type":"电极反应","condition":"碱性电解质","phenomenon":"—","ionic":"同式","note":"不同电解质环境下燃料电池电极式写法不同；钢铁在潮湿空气中的常见腐蚀模型。","level":"★★★★☆"},{"eq":"2CuSO₄ + 2H₂O → 2Cu + O₂↑ + 2H₂SO₄","name":"惰性电极电解 CuSO₄","type":"电解反应","condition":"惰性电极、通电","phenomenon":"阴极析铜，阳极放氧","ionic":"2Cu²⁺ + 2H₂O → 2Cu + O₂↑ + 4H⁺","note":"电解后溶液酸性增强。","level":"★★★★★"},{"eq":"Cu → Cu²⁺ + 2e⁻","name":"电解精炼铜阳极","type":"电极反应","condition":"粗铜作阳极","phenomenon":"阳极铜溶解","ionic":"同式","note":"比 Cu 活泼的杂质也可能进入溶液，较不活泼杂质形成阳极泥。","level":"★★★★☆"},{"eq":"2H₂ + 4OH⁻ → 4H₂O + 4e⁻","name":"碱性氢氧燃料电池负极","type":"电极反应","condition":"碱性电解质","phenomenon":"—","ionic":"同式","note":"燃料 H₂ 在负极被氧化。","level":"★★★★☆"}],"focus":"原电池、电解池、电极反应","difficulty":"离子迁移、放电顺序、电子守恒","knowledge":[{"title":"原电池判断口诀背后的逻辑","body":"负极发生氧化、失电子；正极发生还原、得电子。电子在外电路从负极流向正极，溶液中离子迁移以维持电中性。"},{"title":"电解池","body":"阳极发生氧化、阴极发生还原。判断实际放电粒子时需考虑电极材料、离子种类、浓度和水的参与。"},{"title":"金属腐蚀与保护","body":"电化学腐蚀通常比单纯化学腐蚀更普遍。保护方法包括涂层隔绝、牺牲阳极的阴极保护和外加电流阴极保护等。"},{"title":"电解定量","body":"串联电路中各电极通过的电子物质的量相同。定量题先用电极反应建立电子与产物的计量关系，再结合电量或物质的量。"}]},"烃与卤代烃":{"group":"有机化学","intro":"这一部分建立有机合成的碳骨架基础。烷烃、烯烃、炔烃和芳香烃因键型不同表现出不同反应特征；卤代烃则是连接烃与醇、烯烃等官能团的重要桥梁。重点是取代、加成、消去及反应条件；难点是同分异构、反应条件选择和多步合成路线。","reactions":[{"eq":"CH≡CH + 2Br₂ → CHBr₂CHBr₂","name":"乙炔与足量溴","type":"加成反应","condition":"常温","phenomenon":"溴颜色褪去","ionic":"—","note":"碳碳三键可连续发生加成。","level":"★★★★☆"},{"eq":"C₆H₆ + Br₂ → C₆H₅Br + HBr","name":"苯的溴代","type":"取代反应","condition":"FeBr₃或Fe催化","phenomenon":"—","ionic":"—","note":"不是溴水加成。","level":"★★★★★"},{"eq":"C₆H₆ + HNO₃ → C₆H₅NO₂ + H₂O","name":"苯的硝化","type":"取代反应","condition":"浓H₂SO₄，50～60℃","phenomenon":"—","ionic":"—","note":"浓硫酸催化。","level":"★★★★★"},{"eq":"C₆H₆ + 3H₂ → C₆H₁₂","name":"苯加氢","type":"加成反应","condition":"Ni，加热、加压","phenomenon":"—","ionic":"—","note":"","level":"★★★★☆"},{"eq":"CH₃CH₂Br + NaOH → CH₃CH₂OH + NaBr","name":"卤代烃水解","type":"取代反应","condition":"NaOH 水溶液、加热","phenomenon":"—","ionic":"—","note":"水溶液偏取代，醇溶液偏消去，是高频条件辨析；水溶液取代。","level":"★★★★★"},{"eq":"CH₃CH₂Br + NaOH → CH₂=CH₂ + NaBr + H₂O","name":"卤代烃消去","type":"消去反应","condition":"NaOH 醇溶液、加热","phenomenon":"—","ionic":"—","note":"β-碳上需要有可消去的氢；注意反应条件；醇溶液消去。","level":"★★★★★"},{"eq":"CH₂=CH₂ + Br₂ → BrCH₂CH₂Br","name":"乙烯与溴","type":"加成反应","condition":"常温","phenomenon":"溴的颜色褪去","ionic":"—","note":"用于检验碳碳双键，避免与苯的取代反应混淆。","level":"★★★★★"},{"eq":"CH₂=CH₂ + HCl → CH₃CH₂Cl","name":"乙烯与 HCl 加成","type":"加成反应","condition":"一定条件","phenomenon":"—","ionic":"—","note":"双键加成可引入卤素，是官能团转化路线之一。","level":"★★★★☆"},{"eq":"HC≡CH + H₂ → CH₂=CH₂","name":"乙炔部分加氢","type":"加成 / 还原","condition":"催化剂、控制条件","phenomenon":"—","ionic":"—","note":"炔烃可逐步加氢；继续加氢得到烷烃。","level":"★★★★☆"},{"eq":"CH₃CH=CH₂ + HBr → CH₃CHBrCH₃","name":"丙烯与 HBr 加成","type":"加成反应","condition":"通常条件","phenomenon":"—","ionic":"—","note":"不对称烯烃加成涉及区域选择性；高中按教材和题给条件判断。","level":"★★★★☆"}],"focus":"取代、加成、消去、芳香烃","difficulty":"同分异构与合成路线","knowledge":[{"title":"碳骨架与官能团","body":"有机合成通常分两步思考：先构建或调整碳骨架，再通过取代、加成、消去、氧化还原完成官能团转化。"},{"title":"条件决定反应","body":"卤代烃在 NaOH 水溶液中更偏向取代，在 NaOH 醇溶液并加热时更偏向消去；这是高频条件辨析。"}]},"醇与酚":{"group":"有机化学","intro":"醇和酚都含羟基，但羟基所连接的碳骨架不同，使它们的酸性和反应类型存在明显差异。醇重点掌握与活泼金属、氧化、消去和酯化；苯酚重点掌握弱酸性、与溴水的取代和显色/检验思路。高频难点是乙醇在不同温度下脱水产物不同，以及醇、酚、羧酸酸性的比较。","reactions":[{"eq":"2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂↑","name":"乙醇与钠","type":"置换反应","condition":"常温","phenomenon":"产生气泡","ionic":"—","note":"","level":"★★★★☆"},{"eq":"CH₃CH₂OH → CH₂=CH₂ + H₂O","name":"乙醇消去","type":"消去反应","condition":"浓H₂SO₄，170℃","phenomenon":"生成乙烯","ionic":"—","note":"170℃。","level":"★★★★★"},{"eq":"2CH₃CH₂OH → CH₃CH₂OCH₂CH₃ + H₂O","name":"乙醇分子间脱水","type":"脱水反应","condition":"浓H₂SO₄，约140℃","phenomenon":"—","ionic":"—","note":"与170℃区分。","level":"★★★★★"},{"eq":"C₆H₅OH + NaOH → C₆H₅ONa + H₂O","name":"苯酚与 NaOH","type":"酸碱反应","condition":"常温","phenomenon":"苯酚溶解","ionic":"C₆H₅OH + OH⁻ → C₆H₅O⁻ + H₂O","note":"体现苯酚弱酸性；苯酚通常不能使 NaHCO₃ 放出 CO₂。","level":"★★★★★"},{"eq":"C₆H₅OH + 3Br₂ → 2,4,6-C₆H₂Br₃OH↓ + 3HBr","name":"苯酚与浓溴水","type":"取代反应","condition":"常温","phenomenon":"溴水褪色并有白色沉淀","ionic":"—","note":"苯酚检验。","level":"★★★★★"},{"eq":"2C₂H₅OH + O₂ → 2CH₃CHO + 2H₂O","name":"乙醇催化氧化","type":"氧化反应","condition":"Cu 或 Ag 催化、加热","phenomenon":"有刺激性气味的乙醛生成","ionic":"—","note":"伯醇氧化生成醛，是官能团转化主线。","level":"★★★★★"},{"eq":"2C₆H₅OH + 2Na → 2C₆H₅ONa + H₂↑","name":"苯酚与钠","type":"置换反应","condition":"常温","phenomenon":"产生气泡","ionic":"—","note":"苯酚羟基中的氢可被活泼金属取代。","level":"★★★★☆"},{"eq":"C₂H₅OH → CH₂=CH₂ + H₂O","name":"乙醇分子内脱水","type":"消去反应","condition":"浓硫酸、170℃","phenomenon":"生成乙烯","ionic":"—","note":"温度条件是高频考点；较低温度可偏向分子间脱水。","level":"★★★★★"},{"eq":"CH₃CH₂OH + CuO → CH₃CHO + Cu + H₂O","name":"乙醇被 CuO 氧化","type":"氧化还原","condition":"加热","phenomenon":"黑色 CuO 变红，并生成乙醛","ionic":"—","note":"常用于理解醇氧化为醛及 CuO 的氧化性。","level":"★★★★★"}],"focus":"醇氧化/消去、苯酚性质","difficulty":"条件辨析与酸性比较","knowledge":[{"title":"醇的氧化规律","body":"含 α-H 的伯醇可氧化为醛并进一步氧化为酸，仲醇可氧化为酮；具体产物受氧化剂和条件影响。"},{"title":"苯酚的弱酸性","body":"苯酚可与 NaOH 反应，但酸性弱于碳酸，通常不能使 NaHCO₃ 溶液产生 CO₂。"}]},"醛与酮":{"group":"有机化学","intro":"醛和酮都含羰基，但醛基中的氢使醛更容易被氧化。高中重点围绕醛的氧化、还原和特征检验展开，银镜反应与新制氢氧化铜反应是典型实验。难点在于理解这些检验的反应条件，以及把醇—醛/酮—羧酸的官能团转化串成有机合成路线。","reactions":[{"eq":"2CH₃CHO + O₂ → 2CH₃COOH","name":"乙醛氧化为乙酸","type":"氧化反应","condition":"催化或空气氧化","phenomenon":"—","ionic":"—","note":"醛容易被氧化成羧酸。","level":"★★★★★"},{"eq":"CH₃CHO + 2[Ag(NH₃)₂]OH → CH₃COONH₄ + 2Ag↓ + 3NH₃ + H₂O","name":"银镜反应","type":"氧化还原","condition":"水浴加热","phenomenon":"形成银镜","ionic":"—","note":"银氨溶液现配现用。","level":"★★★★★"},{"eq":"CH₃CHO + 2Cu(OH)₂ + NaOH → CH₃COONa + Cu₂O↓ + 3H₂O","name":"醛基与新制Cu(OH)₂","type":"氧化还原","condition":"加热","phenomenon":"砖红色沉淀","ionic":"—","note":"碱性条件。","level":"★★★★★"},{"eq":"CH₃CHO + H₂ → CH₃CH₂OH","name":"乙醛加氢","type":"还原反应","condition":"Ni，加热","phenomenon":"—","ionic":"—","note":"","level":"★★★★☆"},{"eq":"CH₃CHO + 2[Ag(NH₃)₂]⁺ + 3OH⁻ → CH₃COO⁻ + 2Ag↓ + 4NH₃ + 2H₂O","name":"乙醛银镜反应","type":"氧化还原","condition":"水浴加热，新制银氨溶液","phenomenon":"试管内壁形成银镜","ionic":"同式","note":"银氨溶液应现配现用，实验后及时处理。","level":"★★★★★"},{"eq":"CH₃CHO + 2Cu(OH)₂ + OH⁻ → CH₃COO⁻ + Cu₂O↓ + 3H₂O","name":"乙醛与新制 Cu(OH)₂","type":"氧化还原","condition":"加热，碱性条件","phenomenon":"产生砖红色 Cu₂O 沉淀","ionic":"同式","note":"必须是新制 Cu(OH)₂，并在碱性条件加热。","level":"★★★★★"},{"eq":"HCHO + 4[Ag(NH₃)₂]⁺ + 6OH⁻ → CO₃²⁻ + 4Ag↓ + 8NH₃ + 4H₂O","name":"甲醛银镜反应","type":"氧化还原","condition":"水浴加热、银氨溶液","phenomenon":"生成银镜","ionic":"同式","note":"甲醛可被进一步氧化，因此与普通一元醛计量关系不同。","level":"★★★★☆"},{"eq":"CH₃COCH₃ + H₂ → CH₃CHOHCH₃","name":"丙酮加氢","type":"还原反应","condition":"Ni 催化、加热","phenomenon":"—","ionic":"—","note":"酮羰基还原得到仲醇。","level":"★★★★☆"}],"focus":"银镜、新制 Cu(OH)₂、还原","difficulty":"官能团转化与检验条件","knowledge":[{"title":"醛基检验","body":"银镜反应和与新制 Cu(OH)₂ 的反应可用于检验具有还原性的醛基体系，但具体物质和反应条件要结合题目。"},{"title":"醛与酮的差别","body":"醛基碳上连有 H，较易被氧化为羧酸；普通酮在温和氧化条件下通常不表现醛类的典型还原性。"}]},"羧酸与酯":{"group":"有机化学","intro":"羧酸的核心官能团是羧基，兼具羰基与羟基的结构特征，表现出明显酸性；羧酸与醇可发生酯化，酯又能在酸性或碱性条件下水解。重点是酸性强弱、酯化反应、酯的水解和有机合成；难点是可逆反应条件、同位素示踪判断断键位置以及皂化反应。","reactions":[{"eq":"2CH₃COOH + Na₂CO₃ → 2CH₃COONa + CO₂↑ + H₂O","name":"乙酸与碳酸钠","type":"酸碱反应","condition":"常温","phenomenon":"产生气泡","ionic":"—","note":"","level":"★★★★☆"},{"eq":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O","name":"酯化","type":"酯化反应","condition":"浓H₂SO₄，加热","phenomenon":"有香味","ionic":"—","note":"","level":"★★★★☆"},{"eq":"CH₃COOC₂H₅ + H₂O ⇌ CH₃COOH + C₂H₅OH","name":"乙酸乙酯酸性水解","type":"水解反应","condition":"稀酸、加热","phenomenon":"—","ionic":"—","note":"酸性水解可逆。","level":"★★★★★"},{"eq":"CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH","name":"乙酸乙酯碱性水解","type":"水解 / 皂化思想","condition":"NaOH、加热","phenomenon":"—","ionic":"—","note":"碱性水解趋于完全，是与酸性水解的重要区别；趋于完全。","level":"★★★★★"},{"eq":"2CH₃COOH + 2Na → 2CH₃COONa + H₂↑","name":"乙酸与钠","type":"置换 / 酸碱","condition":"常温","phenomenon":"产生气泡","ionic":"—","note":"羧酸酸性强于醇和酚，可与活泼金属、碱、碳酸盐反应。","level":"★★★★☆"},{"eq":"CH₃COOH + NaHCO₃ → CH₃COONa + CO₂↑ + H₂O","name":"乙酸与碳酸氢钠","type":"酸碱反应","condition":"常温","phenomenon":"大量气泡","ionic":"CH₃COOH + HCO₃⁻ → CH₃COO⁻ + CO₂↑ + H₂O","note":"可用于比较羧酸与碳酸的酸性，并鉴别羧酸。","level":"★★★★★"},{"eq":"HCOOH + 2[Ag(NH₃)₂]⁺ + 2OH⁻ → CO₂ + 2Ag↓ + 4NH₃ + 2H₂O","name":"甲酸的银镜反应","type":"氧化还原","condition":"水浴加热、银氨溶液","phenomenon":"生成银镜","ionic":"—","note":"甲酸既有羧基，又因结构特殊具有还原性。","level":"★★★★☆"}],"focus":"羧酸酸性、酯化、水解","difficulty":"可逆反应与合成路线","knowledge":[{"title":"酯化中的断键","body":"常见羧酸与醇酯化可理解为羧酸脱羟基、醇脱氢形成水；同位素示踪题常利用这一点判断氧原子去向。"},{"title":"有机合成路线","body":"设计路线时先比较目标物与原料的碳骨架，再倒推官能团变化。常用转化包括卤代烃→醇、醇→醛/酮→羧酸、酸+醇→酯。"}]},"镁 Mg / 钙 Ca":{"group":"金属元素","intro":"镁、钙是活泼金属。镁常考燃烧和还原性，钙常与石灰石、石灰、水硬度、碳酸盐体系结合。","reactions":[{"eq":"2Mg + O₂ → 2MgO","name":"镁在氧气中燃烧","type":"氧化还原","condition":"点燃","phenomenon":"发出耀眼白光，生成白色固体","ionic":"—","note":"实验时不可直视强光。","level":"★★★★★"},{"eq":"3Mg + N₂ → Mg₃N₂","name":"镁与氮气","type":"氧化还原","condition":"点燃","phenomenon":"生成淡黄色/黄绿色氮化镁固体（教材描述可能略有差异）","ionic":"—","note":"镁能在 N₂ 中继续燃烧。","level":"★★★★☆"},{"eq":"2Mg + CO₂ → 2MgO + C","name":"镁在 CO₂ 中燃烧","type":"氧化还原","condition":"点燃","phenomenon":"耀眼白光，生成白色 MgO 和黑色 C","ionic":"—","note":"说明 CO₂ 不支持多数燃烧，但不能扑灭燃烧的 Mg。","level":"★★★★★"},{"eq":"Mg + 2H⁺ → Mg²⁺ + H₂↑","name":"镁与非氧化性酸","type":"氧化还原","condition":"常温","phenomenon":"大量气泡","ionic":"Mg + 2H⁺ → Mg²⁺ + H₂↑","note":"常用于金属活动性比较。","level":"★★★★☆"},{"eq":"Ca + 2H₂O → Ca(OH)₂ + H₂↑","name":"钙与水","type":"氧化还原","condition":"常温","phenomenon":"产生气泡，溶液变浑浊","ionic":"Ca + 2H₂O → Ca²⁺ + 2OH⁻ + H₂↑","note":"Ca(OH)₂ 微溶。","level":"★★★★☆"},{"eq":"CaO + H₂O → Ca(OH)₂","name":"生石灰与水","type":"化合","condition":"常温","phenomenon":"强烈放热，块状固体粉化","ionic":"—","note":"生石灰作干燥剂的原理之一。","level":"★★★★★"},{"eq":"CaCO₃ → CaO + CO₂↑","name":"石灰石分解","type":"分解","condition":"高温","phenomenon":"产生 CO₂","ionic":"—","note":"工业制生石灰。","level":"★★★★★"}]},"铜 Cu":{"group":"金属元素","intro":"铜是不活泼金属，常见 +2 价。重点是 Cu、CuO、Cu(OH)₂、Cu²⁺ 以及与强氧化性酸的反应。","reactions":[{"eq":"2Cu + O₂ → 2CuO","name":"铜与氧气","type":"氧化还原","condition":"加热","phenomenon":"红色铜变黑","ionic":"—","note":"生成 CuO。","level":"★★★★★"},{"eq":"CuO + 2H⁺ → Cu²⁺ + H₂O","name":"氧化铜与酸","type":"酸碱反应","condition":"常温或加热","phenomenon":"黑色固体溶解，形成蓝色 Cu²⁺ 溶液","ionic":"同式","note":"CuO 是碱性氧化物；CuO 属碱性氧化物。","level":"★★★★☆"},{"eq":"Cu²⁺ + 2OH⁻ → Cu(OH)₂↓","name":"铜离子与强碱","type":"离子反应","condition":"常温","phenomenon":"蓝色沉淀","ionic":"同式","note":"新制 Cu(OH)₂ 可用于醛基/还原糖检验；有机物检验常要求“新制 Cu(OH)₂”。","level":"★★★★★"},{"eq":"Cu(OH)₂ → CuO + H₂O","name":"氢氧化铜受热","type":"分解","condition":"加热","phenomenon":"蓝色沉淀变黑","ionic":"—","note":"常见沉淀热分解。","level":"★★★★☆"},{"eq":"Cu + 2Ag⁺ → Cu²⁺ + 2Ag","name":"铜置换银","type":"置换","condition":"AgNO₃ 溶液","phenomenon":"铜表面析出银白色晶体，溶液变蓝","ionic":"同式","note":"可用于活动性比较。","level":"★★★★☆"},{"eq":"CuO + H₂ → Cu + H₂O","name":"氢气还原氧化铜","type":"氧化还原","condition":"加热","phenomenon":"黑色 CuO 逐渐变红","ionic":"—","note":"装置中通常先通 H₂ 排空气，再加热，防止爆炸。","level":"★★★★★"}]},"锌 Zn":{"group":"金属元素","intro":"锌是典型中等活泼金属，常用于金属活动性、原电池、两性化合物和实验室制氢气。","reactions":[{"eq":"Zn + 2HCl → ZnCl₂ + H₂↑","name":"锌与盐酸","type":"置换 / 氧化还原","condition":"常温，稀盐酸","phenomenon":"锌逐渐溶解并持续产生气泡","ionic":"Zn + 2H⁺ → Zn²⁺ + H₂↑","note":"实验室制 H₂ 常用；点燃氢气前必须验纯。","level":"★★★★★"},{"eq":"Zn + Cu²⁺ → Zn²⁺ + Cu","name":"锌置换铜","type":"置换 / 氧化还原","condition":"水溶液","phenomenon":"锌表面析出红色铜","ionic":"同式","note":"也可构成丹尼尔电池的总反应。","level":"★★★★☆"},{"eq":"ZnO + 2H⁺ → Zn²⁺ + H₂O","name":"氧化锌与酸","type":"酸碱反应","condition":"酸性","phenomenon":"白色固体溶解","ionic":"同式","note":"ZnO 是两性氧化物。","level":"★★★☆☆"},{"eq":"ZnO + 2OH⁻ + H₂O → [Zn(OH)₄]²⁻","name":"氧化锌与强碱","type":"酸碱反应","condition":"强碱溶液","phenomenon":"白色固体溶解","ionic":"同式","note":"不同教材可能使用锌酸盐的不同写法。","level":"★★★☆☆"},{"eq":"Zn + 2H⁺ → Zn²⁺ + H₂↑","name":"锌与酸","type":"氧化还原","condition":"常温","phenomenon":"锌溶解并产生气泡","ionic":"同式","note":"常用于原电池、金属活动性和气体制备情境。","level":"★★★★★"}]},"卤素 Br / I":{"group":"非金属元素","intro":"高中常以卤素性质递变、氧化性强弱和卤离子检验出现。重点掌握 Cl₂、Br₂、I₂ 之间的置换关系。","reactions":[{"eq":"Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂","name":"氯气置换溴","type":"氧化还原","condition":"水溶液","phenomenon":"溶液出现橙黄色/橙红色","ionic":"同式","note":"氧化性 Cl₂ > Br₂。","level":"★★★★★"},{"eq":"Cl₂ + 2I⁻ → 2Cl⁻ + I₂","name":"氯气置换碘","type":"氧化还原","condition":"水溶液","phenomenon":"溶液变棕黄；遇淀粉变蓝","ionic":"同式","note":"氧化性 Cl₂ > I₂。","level":"★★★★★"},{"eq":"Br₂ + 2I⁻ → 2Br⁻ + I₂","name":"溴置换碘","type":"氧化还原","condition":"水溶液","phenomenon":"生成碘","ionic":"同式","note":"氧化性 Br₂ > I₂。","level":"★★★★☆"},{"eq":"Ag⁺ + Br⁻ → AgBr↓","name":"溴离子检验","type":"沉淀","condition":"稀硝酸酸化后加 AgNO₃","phenomenon":"淡黄色沉淀","ionic":"同式","note":"AgBr 见光分解，可用于感光材料背景。","level":"★★★★☆"},{"eq":"Ag⁺ + I⁻ → AgI↓","name":"碘离子检验","type":"沉淀","condition":"稀硝酸酸化后加 AgNO₃","phenomenon":"黄色沉淀","ionic":"同式","note":"AgCl 白、AgBr 淡黄、AgI 黄。","level":"★★★★★"},{"eq":"2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂","name":"Fe³⁺ 氧化 I⁻","type":"氧化还原","condition":"水溶液","phenomenon":"生成碘，Fe³⁺ 被还原","ionic":"同式","note":"常用于氧化还原强弱比较。","level":"★★★★☆"}]},"氧 O / 过氧化氢":{"group":"非金属元素","intro":"氧气是常见氧化剂；过氧化氢既有氧化性也有还原性，是实验制氧和氧化还原综合题的重要物质。","reactions":[{"eq":"2H₂O₂ → 2H₂O + O₂↑","name":"过氧化氢分解","type":"分解 / 氧化还原","condition":"MnO₂ 催化或光照","phenomenon":"产生大量无色气泡","ionic":"—","note":"H₂O₂ 中 O 为 −1 价，发生歧化。","level":"★★★★★"},{"eq":"2KMnO₄ → K₂MnO₄ + MnO₂ + O₂↑","name":"高锰酸钾制氧气","type":"分解反应","condition":"加热","phenomenon":"产生 O₂，并生成 MnO₂","ionic":"—","note":"试管口常塞棉花防止粉末进入导管；实验室制 O₂ 的一种方法。","level":"★★★★☆"},{"eq":"2H₂ + O₂ → 2H₂O","name":"氢气燃烧","type":"化合 / 氧化还原","condition":"点燃","phenomenon":"淡蓝色火焰，放出大量热","ionic":"—","note":"氢气与空气/氧气混合后点燃前要验纯。","level":"★★★★☆"},{"eq":"2KClO₃ → 2KCl + 3O₂↑","name":"氯酸钾制氧气","type":"分解反应","condition":"MnO₂ 催化、加热","phenomenon":"产生无色气体","ionic":"—","note":"实验室制 O₂ 的经典反应；MnO₂ 作催化剂。","level":"★★★★☆"},{"eq":"2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂","name":"过氧化钠与 CO₂","type":"氧化还原","condition":"常温","phenomenon":"消耗 CO₂ 并释放 O₂","ionic":"—","note":"Na₂O₂ 可用于供氧体系；不要简单归为酸性氧化物与碱性氧化物反应。","level":"★★★★★"}]},"锰 Mn / 高锰酸钾":{"group":"金属元素","intro":"高中主要围绕 MnO₂ 和 KMnO₄。酸性高锰酸钾是强氧化剂，常用于 Fe²⁺、SO₂、H₂O₂ 等还原性物质的检验和滴定。","reactions":[{"eq":"MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O","name":"酸性高锰酸钾氧化 Fe²⁺","type":"氧化还原","condition":"酸性，通常用稀 H₂SO₄ 酸化","phenomenon":"紫色高锰酸根褪色","ionic":"同式","note":"不能用 HCl 酸化，Cl⁻ 可能被氧化；酸化通常用稀硫酸，不用盐酸避免 Cl⁻ 被氧化。","level":"★★★★★"},{"eq":"2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂↑ + 8H₂O","name":"酸性 KMnO₄ 氧化 H₂O₂","type":"氧化还原","condition":"酸性","phenomenon":"紫色褪去并产生气泡","ionic":"同式","note":"此反应中 H₂O₂ 作还原剂；H₂O₂ 在此作还原剂。","level":"★★★★☆"},{"eq":"2MnO₄⁻ + 5SO₃²⁻ + 6H⁺ → 2Mn²⁺ + 5SO₄²⁻ + 3H₂O","name":"酸性 KMnO₄ 氧化亚硫酸根","type":"氧化还原","condition":"酸性溶液","phenomenon":"紫色褪去","ionic":"同式","note":"高锰酸根还原产物与介质有关；酸性条件主要生成 Mn²⁺。","level":"★★★★☆"}]},"实验与定量":{"group":"基础与实验","intro":"高中化学实验不仅考“会不会做”，还考为什么这样做。核心包括物质的量与浓度、一定物质的量浓度溶液的配制、气体收集与净化、物质分离提纯、离子检验、滴定思想以及实验安全。复习时要把操作顺序、仪器用途、误差方向和反应原理连在一起。","focus":"物质的量浓度、容量瓶、分离提纯、气体制备与检验、实验安全","difficulty":"误差分析、装置顺序、试剂选择与排除干扰","knowledge":[{"title":"物质的量浓度","body":"c = n/V，其中 V 必须使用溶液体积而不是溶剂体积。配制一定物质的量浓度溶液时，常见步骤为计算、称量/量取、溶解、转移、洗涤、定容、摇匀。"},{"title":"容量瓶","body":"容量瓶用于准确配制一定体积的溶液，不能直接溶解固体、不能加热。定容时视线应与刻度线和凹液面最低点相平。"},{"title":"分离方法","body":"过滤用于固液分离；蒸馏常用于互溶液体或溶剂回收；分液用于互不相溶液体；萃取利用溶质在两种互不相溶溶剂中的溶解度差。"},{"title":"实验安全","body":"闻气体用扇闻法；加热试管先预热；浓酸稀释通常把酸沿器壁慢慢加入水中并搅拌；有毒、刺激性尾气应吸收或处理。"},{"title":"滴定管读数","body":"滴定管刻度从上到下增大，读数一般估读到 0.01 mL。使用前要检查漏水、润洗并排尽尖嘴气泡。"},{"title":"滴定误差","body":"先判断错误操作使标准液实际消耗体积偏大还是偏小，再代入计量关系判断待测浓度结果偏高或偏低。"}],"reactions":[{"eq":"Ag⁺ + Cl⁻ → AgCl↓","name":"Cl⁻ 检验核心反应","type":"离子反应","condition":"先酸化排除干扰，再加 AgNO₃","phenomenon":"白色沉淀","ionic":"同式","note":"检验 Cl⁻ 时常先用稀硝酸酸化，避免 CO₃²⁻ 等干扰。","level":"★★★★★"},{"eq":"Ba²⁺ + SO₄²⁻ → BaSO₄↓","name":"SO₄²⁻ 检验核心反应","type":"离子反应","condition":"酸性条件下加入可溶性钡盐","phenomenon":"白色沉淀","ionic":"同式","note":"酸化是为了排除 CO₃²⁻、SO₃²⁻ 等可能产生沉淀的离子。","level":"★★★★★"},{"eq":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O","name":"NH₄⁺ 检验","type":"离子反应","condition":"加碱并加热","phenomenon":"产生刺激性气味气体，湿润红色石蕊试纸变蓝","ionic":"同式","note":"不能把湿润试纸直接伸入试管深处；注意氨气安全。","level":"★★★★★"},{"eq":"CO₃²⁻ + 2H⁺ → CO₂↑ + H₂O","name":"CO₃²⁻ 检验","type":"离子反应","condition":"加酸","phenomenon":"产生气泡","ionic":"同式","note":"单凭产生气体不能唯一证明 CO₃²⁻，要结合后续 CO₂ 检验。","level":"★★★★★"},{"eq":"H⁺ + OH⁻ → H₂O","name":"酸碱中和滴定核心反应","type":"中和反应","condition":"滴定条件","phenomenon":"指示剂在终点附近发生颜色变化","ionic":"同式","note":"读数、润洗、气泡、终点判断都会影响滴定结果。","level":"★★★★★"},{"eq":"MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O","name":"高锰酸钾滴定 Fe²⁺","type":"氧化还原滴定","condition":"硫酸酸化","phenomenon":"终点出现持久浅红/粉红色","ionic":"同式","note":"KMnO₄ 可作自身指示剂；通常用 H₂SO₄ 酸化。","level":"★★★★★"}]},"反应热 / 反应速率":{"group":"化学反应原理","intro":"化学反应原理首先研究“反应能不能发生、快不快、能进行到什么程度”。反应热用焓变 ΔH 描述能量变化；反应速率描述单位时间内物质浓度的变化；碰撞理论用于解释浓度、温度、压强和催化剂对速率的影响。高考中常把速率、平衡、能量图像和工业条件放在同一道综合题里。","focus":"焓变、热化学方程式、盖斯定律、反应速率、影响速率因素","difficulty":"能量图像、ΔH 正负、速率比较、变量控制实验","knowledge":[{"title":"放热与吸热","body":"放热反应 ΔH＜0，体系向环境释放能量；吸热反应 ΔH＞0。反应物和生成物的能量高低可用能量—反应进程图表示。"},{"title":"热化学方程式","body":"必须标明物质状态，化学计量数与 ΔH 一一对应；方程式倍乘时 ΔH 同倍变化，逆写时 ΔH 变号。"},{"title":"盖斯定律","body":"一个反应的焓变只与始态、终态有关，与具体途径无关。可通过已知热化学方程式代数加减得到目标反应 ΔH。"},{"title":"速率影响因素","body":"在其他条件一定时，增大反应物浓度、升高温度通常使速率增大；对有气体参与的反应，压缩体积可增大相关气体浓度；催化剂通过降低活化能改变速率，但不改变平衡常数。"},{"title":"活化能","body":"催化剂提供新的反应路径并降低活化能，使正、逆反应速率都增大；催化剂不改变反应的 ΔH，也不改变平衡常数。"},{"title":"控制变量","body":"探究温度、浓度、催化剂等对速率影响时，除目标变量外其他条件应尽量保持一致，并选取可测量的时间、体积、浓度或颜色变化作为指标。"}],"reactions":[{"eq":"2H₂(g) + O₂(g) → 2H₂O(l)","name":"氢气燃烧的热化学表示","type":"放热反应","condition":"点燃","phenomenon":"剧烈燃烧，生成水","ionic":"—","note":"热化学方程式必须注意物质状态；H₂O(l) 与 H₂O(g) 对应的 ΔH 不同。","level":"★★★★★"},{"eq":"CaCO₃(s) → CaO(s) + CO₂(g)","name":"碳酸钙热分解","type":"吸热反应","condition":"高温","phenomenon":"放出 CO₂","ionic":"—","note":"分解需要持续供热；与石灰石煅烧、工业生产相关。","level":"★★★★☆"},{"eq":"2H₂O₂ → 2H₂O + O₂↑","name":"过氧化氢分解","type":"分解 / 速率实验","condition":"MnO₂ 或 Fe³⁺ 催化","phenomenon":"大量气泡","ionic":"—","note":"常用于探究催化剂、温度和浓度对速率的影响。","level":"★★★★★"},{"eq":"S₂O₃²⁻ + 2H⁺ → S↓ + SO₂↑ + H₂O","name":"硫代硫酸根与酸","type":"速率探究反应","condition":"酸性条件","phenomenon":"溶液逐渐浑浊并有 SO₂","ionic":"同式","note":"常通过出现相同浑浊程度所需时间比较反应速率。","level":"★★★★☆"},{"eq":"H⁺(aq) + OH⁻(aq) → H₂O(l)","name":"强酸强碱中和热核心反应","type":"放热反应","condition":"稀溶液","phenomenon":"温度升高","ionic":"同式","note":"测定中和反应反应热时要减少散热，并正确处理温度变化。","level":"★★★★★"},{"eq":"N₂ + 3H₂ ⇌ 2NH₃","name":"合成氨中的速率与平衡","type":"可逆反应","condition":"催化剂、适宜温度和压强","phenomenon":"—","ionic":"—","note":"工业条件是速率、平衡、能耗和设备成本的综合折中。","level":"★★★★★"},{"eq":"C(s) + O₂(g) → CO₂(g)","name":"碳完全燃烧","type":"放热反应","condition":"点燃","phenomenon":"放出大量热","ionic":"—","note":"热化学方程式中物质状态与化学计量数都会影响 ΔH 表述。","level":"★★★★☆"}]},"资源环境 / 无机材料":{"group":"化学与社会","intro":"高中化学不仅研究物质本身，也强调资源、材料、环境与可持续发展。硅酸盐材料、金属冶炼、海水资源、氮硫氧化物污染、温室气体和绿色化学都是典型情境。考试常把基础反应嵌入真实工业流程，因此要会从流程图识别原料、循环物质、除杂步骤和环境处理。","focus":"硅酸盐材料、金属冶炼、海水资源、污染控制、绿色化学","difficulty":"工业流程图、循环利用、除杂与环保处理","knowledge":[{"title":"传统无机非金属材料","body":"玻璃、陶瓷、水泥的主要原料和组成不同，但都与硅酸盐化学密切相关。SiO₂ 是重要原料，同时也是光纤和现代材料的重要组成。"},{"title":"金属冶炼","body":"活泼金属常采用电解法，中等活泼金属常用热还原法；金属活动性、矿石组成、能耗和经济性共同决定工业路线。"},{"title":"绿色化学","body":"强调从源头减少污染，提高原子利用率，减少有毒原料和副产物，并考虑能源消耗、回收和生命周期。"}],"reactions":[{"eq":"Fe₂O₃ + 3CO → 2Fe + 3CO₂","name":"高炉炼铁核心还原反应","type":"氧化还原","condition":"高温","phenomenon":"铁氧化物被还原","ionic":"—","note":"CO 是重要还原剂；工业高炉过程还包含焦炭燃烧、CO 形成及造渣。","level":"★★★★★"},{"eq":"2Al₂O₃(l) → 4Al + 3O₂↑","name":"电解熔融氧化铝","type":"电解反应","condition":"熔融、电解","phenomenon":"阴极得到铝","ionic":"—","note":"工业铝冶炼属于熔融盐电解思想，不能用水溶液电解得到金属铝。","level":"★★★★★"},{"eq":"CaCO₃ → CaO + CO₂↑","name":"石灰石煅烧","type":"分解反应","condition":"高温","phenomenon":"放出 CO₂","ionic":"—","note":"水泥、石灰生产和工业流程常见。","level":"★★★★☆"},{"eq":"CaO + SiO₂ → CaSiO₃","name":"炼铁造渣","type":"化合反应","condition":"高温","phenomenon":"形成熔融炉渣","ionic":"—","note":"用于理解高炉中 CaCO₃→CaO 后与 SiO₂ 杂质反应。","level":"★★★★☆"},{"eq":"2CO + O₂ → 2CO₂","name":"一氧化碳燃烧","type":"氧化反应","condition":"点燃","phenomenon":"蓝色火焰并放热","ionic":"—","note":"CO 有毒，工业尾气需控制；燃烧可转化为 CO₂。","level":"★★★★☆"},{"eq":"2SO₂ + O₂ ⇌ 2SO₃","name":"接触法制硫酸核心步骤","type":"可逆 / 氧化还原","condition":"催化剂、适宜温度","phenomenon":"—","ionic":"—","note":"工业条件同时考虑平衡转化率和反应速率。","level":"★★★★★"},{"eq":"N₂ + 3H₂ ⇌ 2NH₃","name":"合成氨工业反应","type":"可逆 / 氧化还原","condition":"催化剂、适宜温度和压强","phenomenon":"—","ionic":"—","note":"循环利用未反应 N₂/H₂ 是工业流程题的重要思想。","level":"★★★★★"}]},"原子结构 / 周期律 / 化学键":{"group":"基础理论","intro":"这一部分是必修阶段连接“微观结构”和“宏观性质”的核心。原子的核电荷数决定元素种类，核外电子排布与元素在周期表中的位置和性质密切相关；同周期、同主族元素会表现出有规律的递变。化学反应的微观本质可以理解为旧化学键断裂与新化学键形成。这里方程式不多，但它决定了后面判断金属性、非金属性、离子半径、化合价、键型和物质性质的逻辑。 本模块以概念、模型和规律为主，不把原子得失电子的示意式混作正式化学方程式。","focus":"原子结构、核素、元素周期表、周期律、离子键与共价键","difficulty":"微粒半径比较、性质递变、结构与性质的因果解释","knowledge":[{"title":"原子与核素","body":"原子由原子核和核外电子构成。质子数决定元素种类；同一元素的不同核素质子数相同、中子数不同。质量数 A = 质子数 Z + 中子数 N。"},{"title":"周期与主族","body":"主族元素的周期数通常对应电子层数，主族序数与最外层电子数有密切关系。利用位置可预测常见化合价、金属性或非金属性。"},{"title":"周期性递变","body":"同周期从左到右，一般原子半径减小，金属性减弱、非金属性增强；同主族从上到下，一般原子半径增大，金属性增强。实际比较要结合具体微粒和电子层结构。"},{"title":"离子半径","body":"同一元素通常阳离子半径小于原子，阴离子半径大于原子。等电子微粒中，核电荷数越大，一般半径越小。"},{"title":"离子键","body":"阴、阳离子之间的静电作用形成离子键。典型离子化合物在熔融状态或水溶液中通常可导电，固态时离子不能自由移动。"},{"title":"共价键","body":"原子间通过共用电子对形成共价键。非极性键和极性键的区别与成键原子的电负性差异有关。"}],"reactions":[]},"氧化还原反应":{"group":"基础理论","intro":"氧化还原反应是高中无机化学和电化学的共同语言。判断时先看元素化合价是否变化：化合价升高的物质被氧化、作还原剂；化合价降低的物质被还原、作氧化剂。真正重要的是建立“化合价变化—电子转移—氧化剂/还原剂—产物”的对应关系，并能用电子守恒配平和解决定量问题。","focus":"化合价、氧化剂与还原剂、电子转移、配平、氧化还原强弱","difficulty":"复杂离子方程式配平、歧化/归中、陌生氧化还原反应","knowledge":[{"title":"氧化与还原同时发生","body":"同一反应中失电子总数必等于得电子总数。氧化剂得到电子后生成还原产物，还原剂失去电子后生成氧化产物。"},{"title":"强弱比较","body":"通常可利用一个自发氧化还原反应判断氧化性或还原性相对强弱，但比较必须基于相同或可比条件，不能脱离介质和浓度。"},{"title":"歧化与归中","body":"同一元素的同一价态同时升高和降低称歧化；同一元素不同价态生成中间价态称归中。Cl₂ 与碱、SO₂ 与 H₂S 是典型模型。"},{"title":"配平思想","body":"复杂反应先确定变价元素和电子得失，再结合电荷守恒、元素守恒，在酸性或碱性介质中补 H⁺、OH⁻ 和 H₂O。"}],"reactions":[{"eq":"2Fe³⁺ + Fe → 3Fe²⁺","name":"铁元素归中反应","type":"氧化还原","condition":"水溶液","phenomenon":"铁逐渐溶解，Fe³⁺ 被还原","ionic":"同式","note":"Fe⁰ 与 Fe³⁺ 归中生成 Fe²⁺，电子守恒非常典型。","level":"★★★★★"},{"eq":"Cl₂ + 2OH⁻ → Cl⁻ + ClO⁻ + H₂O","name":"氯气歧化","type":"歧化反应","condition":"冷、稀碱液","phenomenon":"氯气被吸收","ionic":"同式","note":"Cl 的 0 价同时变为 -1 和 +1。","level":"★★★★★"},{"eq":"SO₂ + 2H₂S → 3S↓ + 2H₂O","name":"硫元素归中","type":"归中反应","condition":"常温","phenomenon":"生成黄色硫沉淀","ionic":"同式","note":"S(+4) 与 S(-2) 归中到 S(0)。","level":"★★★★★"},{"eq":"2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂↑ + 8H₂O","name":"高锰酸根与过氧化氢","type":"氧化还原","condition":"酸性条件","phenomenon":"紫色褪去并产生气泡","ionic":"同式","note":"H₂O₂ 在此作还原剂；介质会影响 MnO₄⁻ 的还原产物。","level":"★★★★★"}]},"物质分类 / 胶体":{"group":"基础概念","intro":"物质分类是高中化学建立知识网络的起点。分类不是为了背名词，而是为了利用“同类物质具有相似性质”预测反应。分散系则把溶液、胶体和浊液放在统一框架中理解，其中胶体的丁达尔效应、分散质粒子尺度和稳定性是高频概念。","focus":"纯净物/混合物、酸碱盐、氧化物、分散系、胶体","difficulty":"交叉分类、氧化物类别、胶体与溶液的本质区别","knowledge":[{"title":"树状分类","body":"物质可先分为纯净物和混合物；纯净物再分单质和化合物。化合物可按组成和性质进一步分为氧化物、酸、碱、盐等。"},{"title":"分散系","body":"分散质分散在分散剂中形成分散系。溶液、胶体、浊液的差别与分散质粒子尺度有关，不能只凭“是否透明”判断。"},{"title":"丁达尔效应","body":"光束通过胶体时可观察到明亮光路，常用于胶体与溶液的简单鉴别。其本质与胶体粒子对光的散射有关。"},{"title":"胶体聚沉","body":"加入电解质、加热或混合带相反电荷的胶体等条件可能使胶体粒子聚集沉降。"}],"reactions":[]},"化学计量 / 物质的量":{"group":"基础概念","intro":"物质的量把微观粒子数与宏观可测质量、气体体积和溶液浓度连接起来，是整个高中化学定量计算的基础。学习时不要孤立背公式，要先判断题目给出的量属于质量、粒子数、气体体积还是溶液浓度，再通过 n 作为中间桥梁建立关系。","focus":"n、M、Nₐ、气体摩尔体积、物质的量浓度","difficulty":"混合体系、气体条件、溶液稀释与反应后浓度","knowledge":[{"title":"核心桥梁","body":"n=m/M，N=nNₐ。物质的量 n 是联系质量 m、粒子数 N 和化学方程式计量关系的核心。"},{"title":"气体摩尔体积","body":"同温同压下气体体积比等于物质的量比。使用特定摩尔体积数值时必须确认温度和压强条件，不能脱离条件机械套用。"},{"title":"溶液浓度","body":"c=n/V，V 指溶液体积。稀释过程中若溶质不反应且不损失，溶质的物质的量保持不变。"},{"title":"阿伏加德罗常数题","body":"先明确所数粒子是什么，再考虑物质状态、分子组成、可逆反应、电离水解和化学键数量，避免只做表面乘法。"}],"reactions":[]},"有机结构 / 同分异构":{"group":"有机化学基础","intro":"有机化学的真正起点不是反应方程式，而是结构。碳原子的成键特点决定了碳链、支链、环和多种官能团，由此产生庞大的同分异构现象。掌握结构简式、键线式、官能团识别、同系物和同分异构体，才能进一步判断有机物性质和设计合成路线。","focus":"有机物表示方法、官能团、同系物、同分异构、研究有机物的一般方法","difficulty":"限制条件下同分异构体数目、结构与性质对应","knowledge":[{"title":"官能团","body":"官能团是决定有机物典型化学性质的原子或原子团，如碳碳双键、羟基、醛基、羰基、羧基、酯基、碳卤键等。"},{"title":"同系物","body":"结构相似、组成上相差一个或若干 CH₂ 原子团的一系列有机物可构成同系物；必须属于同一类别并具有相似结构。"},{"title":"同分异构体","body":"分子式相同、结构不同的化合物互称同分异构体。常见类型包括碳架异构、位置异构和官能团异构。"},{"title":"书写策略","body":"数同分异构体时常按“先碳架、后位置、再官能团”的顺序系统枚举，并利用分子对称性去重。"},{"title":"分离与提纯","body":"研究未知有机物前常先分离提纯。根据沸点、溶解性等差异可采用蒸馏、萃取、重结晶等方法，实验条件应结合物质性质选择。"},{"title":"确定分子式","body":"元素分析可获得元素组成，质谱可提供相对分子质量等信息，再结合各元素质量分数确定实验式和分子式。"},{"title":"确定结构","body":"红外光谱常用于识别典型化学键或官能团，核磁共振氢谱可提供不同化学环境氢原子的种类及相对数量等结构信息。"}],"reactions":[]},"原子结构与性质":{"group":"物质结构与性质","intro":"这一部分从核外电子运动状态出发解释元素性质。重点不是把电子排布当作符号记忆，而是理解能层、能级、原子轨道和电子排布如何影响元素在周期表中的位置，以及电离能、电负性、原子半径等性质为什么呈周期性变化。","focus":"能层与能级、原子轨道、基态电子排布、泡利原理、洪特规则、周期性性质","difficulty":"电子排布式/轨道表示式、价电子判断、电离能异常与性质比较","knowledge":[{"title":"能层、能级与轨道","body":"电子在原子中具有量子化能量状态。能层中包含不同能级，每个原子轨道最多容纳两个自旋相反的电子。"},{"title":"基态电子排布","body":"基态原子电子排布遵循能量最低原理、泡利不相容原理和洪特规则。书写时还要区分全电子排布与价电子排布。"},{"title":"电离能","body":"第一电离能反映气态基态原子失去最外层一个电子的难易程度，总体具有周期性，但受全充满、半充满等稳定结构影响会出现局部异常。"},{"title":"电负性","body":"电负性用于描述成键原子吸引共用电子的能力，可帮助判断键的极性、元素金属性与非金属性趋势。"},{"title":"价电子与离子形成","body":"主族元素的价电子排布与常见化合价密切相关。Na 易失去 1 个价电子形成 Na⁺，Cl 易得到 1 个电子形成 Cl⁻；这属于电子转移示意，不作为普通化学方程式。"},{"title":"轨道表示式检查","body":"写轨道表示式时依次检查：电子总数是否正确、同一轨道是否最多 2 个电子且自旋相反、简并轨道是否先单占后成对。"}],"reactions":[]},"分子结构与性质":{"group":"物质结构与性质","intro":"这一章研究原子怎样通过共价键形成分子，以及分子的空间结构怎样决定极性和宏观性质。内容从共价键、σ键与π键、VSEPR和杂化轨道延伸到分子极性、范德华力和氢键，建立“成键方式 → 空间结构 → 分子间作用 → 物理性质”的完整逻辑。","focus":"共价键、σ/π键、VSEPR、杂化轨道、分子极性、范德华力、氢键","difficulty":"空间构型与杂化判断、分子极性、分子间作用力与熔沸点/溶解性的联系","knowledge":[{"title":"σ键与π键","body":"沿核间连线方向重叠形成的共价键通常称 σ 键；侧向重叠形成 π 键。单键通常是 σ 键，双键常由 1 个 σ 键和 1 个 π 键构成。"},{"title":"键参数","body":"键能、键长、键角可用于描述共价键和分子结构。一般而言，同类键中键长越短、键能往往越大，但比较要注意成键环境。"},{"title":"VSEPR 模型","body":"价层电子对之间相互排斥并尽量远离，可预测许多主族分子的空间结构。孤电子对对成键电子对的排斥通常更强。"},{"title":"杂化轨道","body":"常见 sp、sp²、sp³ 杂化可帮助解释直线、平面三角、四面体等电子域构型。实际分子形状还必须扣除孤电子对占据的位置。"},{"title":"分子极性","body":"分子是否有极性既取决于化学键的极性，也取决于空间构型。CO₂ 含极性键但整体偶极相互抵消，是典型辨析。"},{"title":"范德华力","body":"分子间普遍存在范德华力。组成和结构相似时，分子越大、电子越多，分子间作用通常越强，熔沸点往往相应升高。"},{"title":"氢键","body":"当 H 与电负性较强、半径较小的原子形成极性键时，分子间或分子内可能形成氢键。氢键会显著影响水、HF、醇等物质的性质。"},{"title":"相似相溶","body":"溶解性与溶质—溶剂之间作用有关。“相似相溶”是有用的经验规律，但不能脱离氢键、反应和具体结构机械判断。"}],"reactions":[]},"晶体结构与性质":{"group":"物质结构与性质","intro":"这一章研究微粒在三维空间中的排列、晶胞以及不同晶体的结构与性质。核心包括分子晶体、共价晶体、离子晶体、金属晶体和晶胞计算；配位化学相关内容也统一放入这一章，用于理解中心离子、配体、配位数、典型配合物以及配位作用对物质结构和性质的影响。","focus":"晶体类型、晶胞、配位键与配合物、配位数、结构与性质","difficulty":"晶胞均摊与密度计算、晶体性质比较、配合物组成和配位数判断","knowledge":[{"title":"分子晶体","body":"构成微粒主要是分子，分子间作用相对较弱，因此许多分子晶体熔沸点较低；具体性质还受氢键等影响。"},{"title":"共价晶体","body":"原子通过共价键形成空间网状结构，如金刚石、晶体硅、SiO₂ 等，通常硬度较大、熔点较高。"},{"title":"离子晶体","body":"阴阳离子通过静电作用形成晶体。固态离子不能自由移动，熔融或溶于水后可形成可移动离子而导电。"},{"title":"金属晶体","body":"金属阳离子与自由电子之间的作用可解释金属导电、导热和延展性等共同性质。"},{"title":"晶胞均摊","body":"顶点、棱、面心和体心粒子对一个晶胞的贡献不同。计算晶胞组成时要根据粒子被多少个相邻晶胞共享进行均摊。"},{"title":"配位键","body":"配体提供孤电子对，中心原子或离子提供空轨道，形成具有配位特征的共价键。"},{"title":"配体与配位数","body":"NH₃、H₂O、Cl⁻、CN⁻ 等都可能作为配体。配位数指直接与中心原子配位的配位原子数目。"},{"title":"特征颜色","body":"许多过渡金属配合物具有明显颜色。例如 Cu²⁺ 与过量 NH₃ 形成深蓝色配合物，可用于理解配位反应和物质检验。"}],"reactions":[{"eq":"H⁺ + NH₃ → NH₄⁺","name":"铵根形成与配位键","type":"配位键","condition":"NH₃ 与 H⁺ 结合","phenomenon":"通常用于结构分析","ionic":"同式","note":"NH₃ 中 N 的孤电子对提供给 H⁺ 形成配位键；NH₄⁺ 形成后四个 N—H 键等同。","level":"★★★★★"},{"eq":"Cu²⁺ + 4NH₃ ⇌ [Cu(NH₃)₄]²⁺","name":"四氨合铜(Ⅱ)离子形成","type":"配合物 / 配位键","condition":"氨水适量至过量，具体体系依实验条件","phenomenon":"形成深蓝色配合物溶液","ionic":"Cu²⁺ + 4NH₃ ⇌ [Cu(NH₃)₄]²⁺","note":"用于理解中心离子、配体、配位数和配位键。","level":"★★★★★"},{"eq":"AgCl(s) + 2NH₃ ⇌ [Ag(NH₃)₂]⁺ + Cl⁻","name":"AgCl 在氨水中溶解","type":"配位 / 沉淀平衡","condition":"氨水","phenomenon":"白色 AgCl 可溶解","ionic":"同式","note":"NH₃ 作为配体与 Ag⁺ 形成 [Ag(NH₃)₂]⁺，降低自由 Ag⁺ 浓度，从而促进 AgCl 溶解。","level":"★★★★☆"}]},"基础有机化合物":{"group":"有机化学","intro":"必修阶段的有机化学以生活中常见有机物为入口，重点认识甲烷、乙烯、乙醇、乙酸等代表物质及其典型反应，初步建立“结构决定性质”的意识，并为选择性必修三的系统有机化学打基础。","reactions":[{"eq":"CH₄ + 2O₂ → CO₂ + 2H₂O","name":"甲烷完全燃烧","type":"氧化反应","condition":"点燃","phenomenon":"淡蓝色火焰并放热","ionic":"—","note":"完全燃烧。","level":"★★★★★"},{"eq":"CH₄ + Cl₂ → CH₃Cl + HCl","name":"甲烷一氯取代","type":"取代反应","condition":"光照","phenomenon":"—","ionic":"—","note":"会继续多步取代。","level":"★★★★★"},{"eq":"CH₂=CH₂ + Br₂ → BrCH₂CH₂Br","name":"乙烯与溴加成","type":"加成反应","condition":"常温","phenomenon":"溴的颜色褪去","ionic":"—","note":"双键发生加成。","level":"★★★★★"},{"eq":"CH₂=CH₂ + H₂ → CH₃CH₃","name":"乙烯加氢","type":"加成反应","condition":"Ni，加热","phenomenon":"—","ionic":"—","note":"催化加氢。","level":"★★★★☆"},{"eq":"CH₂=CH₂ + H₂O → CH₃CH₂OH","name":"乙烯水化","type":"加成反应","condition":"催化剂，加热、加压","phenomenon":"—","ionic":"—","note":"工业制乙醇路线之一。","level":"★★★★☆"},{"eq":"nCH₂=CH₂ → [—CH₂—CH₂—]ₙ","name":"乙烯加聚","type":"加聚反应","condition":"催化剂","phenomenon":"—","ionic":"—","note":"生成聚乙烯。","level":"★★★★★"},{"eq":"2CH₃CH₂OH + O₂ → 2CH₃CHO + 2H₂O","name":"乙醇催化氧化","type":"氧化反应","condition":"Cu或Ag，加热","phenomenon":"铜丝可出现黑红变化","ionic":"—","note":"生成乙醛。","level":"★★★★★"},{"eq":"CH₃COOH + NaOH → CH₃COONa + H₂O","name":"乙酸与 NaOH","type":"酸碱反应","condition":"常温","phenomenon":"通常无明显现象","ionic":"CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O","note":"乙酸是弱酸，离子方程式中保留 CH₃COOH 分子。","level":"★★★★★"},{"eq":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O","name":"乙酸乙酯的制备","type":"酯化反应","condition":"浓硫酸、加热","phenomenon":"生成有香味的酯","ionic":"—","note":"浓硫酸起催化和吸水作用；该反应可逆。","level":"★★★★★"},{"eq":"C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂↑","name":"葡萄糖发酵","type":"发酵","condition":"酒化酶，适宜温度","phenomenon":"产生CO₂","ionic":"—","note":"制乙醇。","level":"★★★★☆"},{"eq":"(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆","name":"淀粉水解","type":"水解反应","condition":"酸或酶，加热","phenomenon":"—","ionic":"—","note":"最终生成葡萄糖。","level":"★★★★☆"},{"eq":"C₂H₄ + 3O₂ → 2CO₂ + 2H₂O","name":"乙烯完全燃烧","type":"氧化反应","condition":"点燃","phenomenon":"火焰较明亮并伴有黑烟倾向","ionic":"—","note":"烃燃烧配平常用于有机定量。","level":"★★★★☆"},{"eq":"2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂↑","name":"乙醇与钠","type":"置换反应","condition":"常温","phenomenon":"产生 H₂","ionic":"—","note":"乙醇羟基中的氢可被活泼金属置换。","level":"★★★★★"}]},"生物大分子":{"group":"有机化学基础","intro":"这一部分把有机化学与生命物质联系起来，重点认识糖类、油脂、氨基酸和蛋白质的结构特点、典型性质及水解过程。学习时要区分单糖、二糖和多糖，理解油脂属于高级脂肪酸甘油酯，并认识氨基酸中的氨基和羧基使其具有两性。","focus":"糖类、油脂、氨基酸、蛋白质、水解与营养物质","difficulty":"糖类结构差异、油脂皂化、氨基酸两性、蛋白质水解与性质","knowledge":[{"title":"糖类并不等于“甜”","body":"糖类按水解情况可分为单糖、二糖和多糖。葡萄糖是重要单糖；蔗糖可水解；淀粉和纤维素都是多糖但结构和性质并不相同。"},{"title":"油脂","body":"油脂是高级脂肪酸与甘油形成的酯。碱性条件下水解生成甘油和高级脂肪酸盐，这一过程称皂化。"},{"title":"氨基酸的两性","body":"氨基酸通常同时含有氨基和羧基，因此既可与酸反应也可与碱反应，是理解蛋白质结构和性质的重要基础。"},{"title":"蛋白质","body":"蛋白质由氨基酸通过肽键连接形成。水解可逐步得到多肽、低聚肽直至氨基酸；变性通常不等同于水解。"}],"reactions":[{"eq":"C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆","name":"蔗糖水解","type":"水解反应","condition":"稀酸或酶，加热","phenomenon":"—","ionic":"—","note":"葡萄糖和果糖。","level":"★★★★☆"},{"eq":"(C₆H₁₀O₅)ₙ + nH₂O → nC₆H₁₂O₆","name":"淀粉或纤维素完全水解","type":"水解反应","condition":"酸或酶","phenomenon":"最终生成葡萄糖","ionic":"—","note":"淀粉和纤维素分子式片段相同，但结构和性质不同。","level":"★★★★★"},{"eq":"油脂 + 3NaOH → 甘油 + 3高级脂肪酸钠","name":"油脂皂化","type":"水解反应","condition":"NaOH，加热","phenomenon":"—","ionic":"—","note":"肥皂主要成分。","level":"★★★★★"},{"eq":"nH₂N—R—COOH → [—NH—R—CO—]ₙ + nH₂O","name":"氨基酸缩聚示意","type":"缩聚反应","condition":"适宜条件","phenomenon":"—","ionic":"—","note":"示意式，具体计量按题设。","level":"★★★★☆"},{"eq":"C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂↑","name":"葡萄糖酒精发酵","type":"生化反应","condition":"酶、适宜温度、缺氧","phenomenon":"产生 CO₂ 和乙醇","ionic":"—","note":"联系食品发酵、生物质资源利用。","level":"★★★★☆"},{"eq":"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O","name":"葡萄糖完全氧化","type":"氧化反应","condition":"生物体内酶催化或燃烧","phenomenon":"释放能量","ionic":"—","note":"可联系营养物质供能。","level":"★★★★☆"},{"eq":"蛋白质 + H₂O → 氨基酸","name":"蛋白质水解","type":"水解反应","condition":"酸、碱或酶，适宜条件","phenomenon":"—","ionic":"—","note":"这是总体示意；实际蛋白质水解经历多肽等中间过程。","level":"★★★★☆"}]},"合成高分子":{"group":"有机化学基础","intro":"合成高分子强调“单体—聚合方式—链节—材料性质”的对应关系。高中阶段主要区分加聚反应和缩聚反应，能够由单体写出聚合物结构，也能从链节反推可能的单体，并联系塑料、纤维、橡胶及材料回收利用。","focus":"单体、链节、聚合度、加聚、缩聚、高分子材料","difficulty":"由链节反推单体、加聚与缩聚辨析、聚合物结构简式","knowledge":[{"title":"加聚反应","body":"含碳碳双键等不饱和结构的单体可发生加成聚合，过程中通常不生成小分子副产物。"},{"title":"缩聚反应","body":"含两个或两个以上可反应官能团的单体可经缩合形成高分子，并常伴随 H₂O、HCl 等小分子生成。"},{"title":"链节与聚合度","body":"聚合物结构简式中的重复结构单元称链节，重复次数用 n 表示。链节不一定等同于完整单体分子。"},{"title":"材料与环境","body":"高分子材料性能与结构密切相关。使用和回收时应关注可降解性、循环利用以及焚烧或填埋带来的环境影响。"}],"reactions":[{"eq":"nCH₂=CHCl → [—CH₂—CHCl—]ₙ","name":"氯乙烯加聚生成 PVC","type":"加聚反应","condition":"引发剂、一定条件","phenomenon":"生成聚氯乙烯","ionic":"—","note":"加聚反应主链中的双键打开，单体小分子不脱去；PVC。","level":"★★★★★"},{"eq":"nCF₂=CF₂ → [—CF₂—CF₂—]ₙ","name":"四氟乙烯加聚","type":"加聚反应","condition":"引发剂/适宜条件","phenomenon":"—","ionic":"—","note":"PTFE。","level":"★★★★☆"}]},"有机合成":{"group":"有机化学基础","intro":"有机合成不是把反应机械串起来，而是从目标物的碳骨架和官能团出发逆向思考。先判断是否需要增长、缩短或重排碳链，再规划官能团的引入、保护、转化和恢复，最后检查每一步条件是否兼容、路线是否简洁。","focus":"逆合成思想、碳骨架构建、官能团转化、路线选择","difficulty":"多步路线设计、官能团保护、信息迁移与陌生反应应用","knowledge":[{"title":"先看碳骨架","body":"比较原料与目标物碳原子数和连接方式，先决定是否需要增长碳链、形成环或改变支链，再安排官能团变化。"},{"title":"再看官能团","body":"常见路线包括烯烃加成、卤代烃水解或消去、醇氧化、羰基还原、羧酸与醇酯化等。"},{"title":"逆向分析","body":"从目标物最后一步可能由什么前体得到，再逐步向原料倒推，往往比从原料盲目正推更清晰。"},{"title":"路线评价","body":"优先选择步骤少、原料易得、条件温和、选择性较高、副反应少、原子利用率较高且更安全环保的路线。"}],"reactions":[]}}, BOOKS=[["必修一 · 基础与无机",["物质分类 / 胶体","化学计量 / 物质的量","实验与定量","离子反应","氧化还原反应","钠 Na","氯 Cl","铁 Fe","铝 Al","原子结构 / 周期律 / 化学键"]],["必修二 · 元素与应用",["硫 S","氮 N","碳 C / 硅 Si","反应热 / 反应速率","基础有机化合物","常见气体制备与检验","资源环境 / 无机材料"]],["选择性必修1 · 化学反应原理",["化学平衡 / 水溶液","电化学"]],["选择性必修2 · 物质结构与性质",["原子结构与性质","分子结构与性质","晶体结构与性质"]],["选择性必修3 · 有机化学基础",["有机结构 / 同分异构","烃与卤代烃","醇与酚","醛与酮","羧酸与酯","有机合成","生物大分子","合成高分子"]],["拓展补充",["镁 Mg / 钙 Ca","铜 Cu","锌 Zn","卤素 Br / I","氧 O / 过氧化氢","锰 Mn / 高锰酸钾"]]], BOOKMAP={"物质分类 / 胶体":"必修一 · 基础与无机","化学计量 / 物质的量":"必修一 · 基础与无机","实验与定量":"必修一 · 基础与无机","离子反应":"必修一 · 基础与无机","氧化还原反应":"必修一 · 基础与无机","钠 Na":"必修一 · 基础与无机","氯 Cl":"必修一 · 基础与无机","铁 Fe":"必修一 · 基础与无机","铝 Al":"必修一 · 基础与无机","原子结构 / 周期律 / 化学键":"必修一 · 基础与无机","硫 S":"必修二 · 元素与应用","氮 N":"必修二 · 元素与应用","碳 C / 硅 Si":"必修二 · 元素与应用","反应热 / 反应速率":"必修二 · 元素与应用","基础有机化合物":"必修二 · 元素与应用","常见气体制备与检验":"必修二 · 元素与应用","资源环境 / 无机材料":"必修二 · 元素与应用","化学平衡 / 水溶液":"选择性必修1 · 化学反应原理","电化学":"选择性必修1 · 化学反应原理","原子结构与性质":"选择性必修2 · 物质结构与性质","分子结构与性质":"选择性必修2 · 物质结构与性质","晶体结构与性质":"选择性必修2 · 物质结构与性质","有机结构 / 同分异构":"选择性必修3 · 有机化学基础","烃与卤代烃":"选择性必修3 · 有机化学基础","醇与酚":"选择性必修3 · 有机化学基础","醛与酮":"选择性必修3 · 有机化学基础","羧酸与酯":"选择性必修3 · 有机化学基础","有机合成":"选择性必修3 · 有机化学基础","生物大分子":"选择性必修3 · 有机化学基础","合成高分子":"选择性必修3 · 有机化学基础","镁 Mg / 钙 Ca":"拓展补充","铜 Cu":"拓展补充","锌 Zn":"拓展补充","卤素 Br / I":"拓展补充","氧 O / 过氧化氢":"拓展补充","锰 Mn / 高锰酸钾":"拓展补充"};
const ALL=[];

const ALL_UNIQUE=[];

ALL.forEach(r=>{if(!_seenEq.has(r.eq)){_seenEq.add(r.eq);ALL_UNIQUE.push(r)}});

let selected='全部',view='library',filter='全部';
let trainMode='hub',topicScope='',topicQuiz=null,comprehensiveQuiz=null;
const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),filters=document.getElementById('filters');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function displayEq(eq,condition){
  const arrows=['⇌','→','↔','='];
  let arrow=arrows.find(a=>eq.includes(a));
  if(!arrow) return `<div class="eqwrap"><span class="eqpart">${esc(eq)}</span></div>`;
  let parts=eq.split(arrow);
  let left=parts.shift(), right=parts.join(arrow);
  let cond=(condition && condition!=='—' && condition!=='无')?condition:'';
  return `<div class="eqwrap"><span class="eqpart">${esc(left.trim())}</span><span class="arrowwrap"><span class="condtop">${esc(cond)}</span><span class="arrowmain">${esc(arrow)}</span></span><span class="eqpart">${esc(right.trim())}</span></div>`;
}


function navR(){
  nav.innerHTML='';
  let a=document.createElement('button');
  a.textContent='总览 · 全部内容';
  a.className=selected==='全部'?'active':'';
  a.onclick=()=>openSec('全部');
  nav.appendChild(a);

  BOOKS.forEach(([book,mods])=>{
    let g=document.createElement('button');
    g.type='button';
    g.className='grade-title grade-button '+(filter===book&&selected==='全部'?'active-book':'');
    g.textContent=book;
    g.title='查看 '+book+' 全部内容';
    g.onclick=()=>{view='library';selected='全部';filter=book;search.value='';navR();setTabs();render();window.scrollTo({top:0,behavior:'smooth'})};
    nav.appendChild(g);

    mods.forEach(m=>{
      if(!DATA[m]) return;
      let b=document.createElement('button');
      b.textContent=m;
      b.className=selected===m?'active':'';
      b.onclick=()=>openSec(m);
      nav.appendChild(b);
    });
  });
}

function filtersR(){
  filters.innerHTML='';
  if(view!=='library') return;
  const opts=[['全部','全部'],...BOOKS.map(([book])=>[book,book])];
  opts.forEach(([value,label])=>{
    let b=document.createElement('button');
    b.className='filter '+(filter===value?'active':'');
    b.textContent=label;
    b.onclick=()=>{filter=value;selected='全部';navR();render();filtersR()};
    filters.appendChild(b);
  });
}

}

function card(r){
  return `<div class="card"><div class="name">${esc(r.name)} <span class="pill">${esc(r.type)}</span></div><div class="cardtop"><div>${displayEq(r.eq,r.condition)}</div><div class="stars">${esc(r.level)}</div></div><div class="details"><div><label>① 实验现象</label>${esc(r.phenomenon)}</div><div><label>② 离子方程式 / 电极式</label>${esc(r.ionic)}</div><div class="wide"><label>③ 高频易错点</label>${esc(r.note)}</div></div></div>`;
}

function library(){
  let q=search.value.trim().toLowerCase();
  let h=(!q&&selected==='全部'&&filter==='全部')?overview():'';

  let matchedTopics=0,matchedReactions=0,matchedCards=0;
  Object.entries(DATA).forEach(([s,v])=>{
    if(selected!=='全部'&&selected!==s) return;
    if(filter!=='全部'&&BOOKMAP[s]!==filter) return;

    let rs=v.reactions.filter(r=>!q||[s,v.intro,...Object.values(r)].join(' ').toLowerCase().includes(q));
    let ks=(v.knowledge||[]).filter(k=>!q||[s,v.intro,k.title,k.body].join(' ').toLowerCase().includes(q));
    if(!rs.length&&!ks.length) return;
    matchedTopics++;matchedReactions+=rs.length;matchedCards+=ks.length;

    let focus=v.focus?`<div class="focus-row"><div><b>重点</b>${esc(v.focus)}</div><div><b>难点</b>${esc(v.difficulty||'')}</div></div>`:'';
    let knowledge=ks.length?`<div class="knowledge-head">知识卡</div><div class="knowledge-grid">${ks.map(k=>`<div class="knowledge-card"><h3>${esc(k.title)}</h3><p>${esc(k.body)}</p></div>`).join('')}</div>`:'';
    let reactions=rs.length?`<div class="eq-section-head"><span>化学方程式</span><em>${rs.length} 条</em></div><div class="cards">${rs.map(card).join('')}</div>`:'';

    h+=`<section class="section"><div class="crumb">${esc(BOOKMAP[s]||'')}</div><div class="head"><h2>${esc(s)}</h2><span class="module-count">${rs.length} 条反应 · ${ks.length} 张知识卡</span></div><div class="topic-intro-box"><div class="intro-label">知识简介</div><p>${esc(v.intro)}</p>${focus}</div>${knowledge}${reactions}</section>`;
  });

  if(q||filter!=='全部'){
    const label=q?`“${esc(search.value.trim())}”`:`${esc(filter)}`;
    const summary=`<div class="result-summary"><b>${label}</b><span>${matchedTopics} 个知识点 · ${matchedReactions} 条反应 · ${matchedCards} 张知识卡</span></div>`;
    h=summary+h;
  }
  return h||'<div class="empty">没有找到匹配内容。可以换一个关键词，或按 Esc 清空搜索。</div>';
}

const nets=[
 ['Na','Na₂O₂','NaOH','Na₂CO₃','NaHCO₃'],
 ['Fe','Fe²⁺','Fe(OH)₂','Fe(OH)₃','Fe³⁺'],
 ['Al','Al³⁺','Al(OH)₃','[Al(OH)₄]⁻'],
 ['N₂','NH₃','NO','NO₂','HNO₃'],
 ['S','SO₂','SO₃','H₂SO₄'],
 ['CH₂=CH₂','CH₃CH₂OH','CH₃CHO','CH₃COOH','CH₃COOC₂H₅']
];

 const n=(f,name)=>`<div class="ognode"><b>${f}</b><small>${name}</small></div>`;
 const a=c=>`<div class="ogarrow"><small>${c}</small>→</div>`;
 return `<section class="section"><div class="crumb">选择性必修3 · 有机化学基础</div><h2>有机化学核心反应路线图</h2><p class="intro">按“官能团如何变化”建立主线。每一行都是独立的常见转化路线，不把无直接关系的反应强行连在一起。</p>
 <div class="maplegend"><span>加成</span><span>取代</span><span>消去</span><span>氧化/还原</span><span>酯化/水解</span><span>聚合</span></div>
 <div class="orgmap"><div class="orgcanvas">
  <div class="orgrow">${n('CH₂=CH₂','乙烯')}${a('H₂O / 催化，加热加压')}${n('CH₃CH₂OH','乙醇')}${a('催化氧化')}${n('CH₃CHO','乙醛')}${a('氧化')}${n('CH₃COOH','乙酸')}${a('C₂H₅OH / 浓H₂SO₄，加热')}${n('CH₃COOC₂H₅','乙酸乙酯')}</div>
  <div class="orgrow">${n('CH₃CH₂Br','溴乙烷')}${a('NaOH水溶液，加热')}${n('CH₃CH₂OH','乙醇')}${a('浓H₂SO₄，170℃')}${n('CH₂=CH₂','乙烯')}${a('Br₂')}${n('BrCH₂CH₂Br','1,2-二溴乙烷')}</div>
  <div class="orgrow">${n('CH≡CH','乙炔')}${a('H₂ / 催化，控制用量')}${n('CH₂=CH₂','乙烯')}${a('H₂ / 催化')}${n('CH₃CH₃','乙烷')}</div>
  <div class="orgrow">${n('C₆H₆','苯')}${a('Br₂ / FeBr₃')}${n('C₆H₅Br','溴苯')}${a('硝化 / 磺化等')}${n('芳香族衍生物','苯环取代')}</div>
  <div class="orgrow">${n('C₆H₅OH','苯酚')}${a('浓溴水')}${n('2,4,6-三溴苯酚','白色沉淀')}${a('另一路：NaOH')}${n('C₆H₅ONa','苯酚钠')}</div>
  <div class="orgrow">${n('油脂','高级脂肪酸甘油酯')}${a('NaOH / 加热')}${n('甘油 + 高级脂肪酸钠','皂化产物')}</div>
  <div class="orgrow">${n('CH₂=CH₂','乙烯')}${a('加聚')}${n('[—CH₂—CH₂—]ₙ','聚乙烯')}${a('材料方向')}${n('塑料制品','结构决定性能')}</div>
  <div class="orgrow">${n('CH₂=CHCl','氯乙烯')}${a('加聚')}${n('[—CH₂—CHCl—]ₙ','聚氯乙烯')}</div>

function network(){
  return `<section class="section"><div class="crumb">综合复习</div><h2>核心反应网络</h2><p class="intro">跨册复习时，用物质转化链把分散知识串起来。</p><div class="cards">${nets.map(n=>`<div class="network">${n.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${esc(x)}</span>`).join('')}</div>`).join('')}</div></section>`;
}


function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function topicOptions(){
 let groups=BOOKS.map(([book,mods])=>{
   const usable=mods.filter(m=>DATA[m] && DATA[m].reactions && DATA[m].reactions.length);
   if(!usable.length)return '';
   return `<optgroup label="${esc(book)}">${usable.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</optgroup>`;
 }).join('');
 return `<option value="">请选择专题</option>${groups}`;
}
function trainingHub(){
 return `<section class="section"><div class="crumb">默写训练</div><h2>选择训练方式</h2><p class="intro">专题训练只考你选中的知识块；综合训练从全站去重后的方程式题库随机抽题，避免同一方程式因不同专题重复出现。</p>
 <div class="train-grid">
  <div class="train-card"><h3>专题训练</h3><p>例如只练“钠”“氯”“铁”“硫”“电化学”“醛与酮”等，哪里薄弱就单独刷哪里。</p><select id="topicSelect" class="select">${topicOptions()}</select><button class="primary" onclick="startTopic()">开始专题训练</button></div>
  <div class="train-card"><h3>综合训练</h3><p>从必修一、必修二、选择性必修和拓展内容中随机抽取，适合阶段复习和考前自测。</p><button class="primary" onclick="startComprehensive()">开始综合训练</button></div>
 </div></section>`;
}
function startTopic(){
 let s=document.getElementById('topicSelect').value;
 if(!s)return;
 topicScope=s;
 topicQuiz=pick(ALL.filter(x=>x.section===topicScope));
 trainMode='topic';
 render();
}
function nextTopic(){
 const pool=ALL.filter(x=>x.section===topicScope);
 if(!pool.length)return;
 if(pool.length===1){topicQuiz=pool[0];render();return;}
 let next=pick(pool);
 while(topicQuiz&&next===topicQuiz) next=pick(pool);
 topicQuiz=next;
 render();
}
function startComprehensive(){
 comprehensiveQuiz=pick(ALL_UNIQUE);
 trainMode='comprehensive';
 render();
}
function nextComp(){
 if(!ALL_UNIQUE.length)return;
 if(ALL_UNIQUE.length===1){comprehensiveQuiz=ALL_UNIQUE[0];render();return;}
 let next=pick(ALL_UNIQUE);
 while(comprehensiveQuiz&&next===comprehensiveQuiz) next=pick(ALL_UNIQUE);
 comprehensiveQuiz=next;
 render();
}
function trainQuestion(q,title,nextFn){
 if(!q)return `<section class="section"><h2>${esc(title)}</h2><div class="empty">这个专题暂时没有可默写的化学方程式。</div><button class="secondary" onclick="trainMode='hub';render()">返回训练选择</button></section>`;
 return `<section class="section"><div class="train-head"><div><div class="crumb">${esc(BOOKMAP[q.section]||'')} · ${esc(q.section)}</div><h2>${esc(title)}</h2></div><span class="score">自由练习</span></div>
 <p class="intro">看到反应名称后，先在纸上默写完整方程式和箭头条件，再核对答案。<span class="keyhint">空格显示答案 · Enter 下一题</span></p>
 <div class="quizbox" aria-label="当前默写题">${esc(q.name)}</div>
 <div id="ans" class="answer" aria-live="polite"><b>方程式：</b>${displayEq(q.eq,q.condition)}<div style="height:7px"></div><b>现象：</b>${esc(q.phenomenon)}<br><b>离子方程式 / 电极式：</b>${esc(q.ionic)}<br><b>易错：</b>${esc(q.note)}</div>
 <div class="train-actions"><button class="primary" onclick="document.getElementById('ans').classList.add('show')">显示答案</button><button class="secondary" onclick="${nextFn}()">下一题 →</button><button class="secondary" onclick="trainMode='hub';render()">返回训练选择</button></div></section>`;
}
function trainingView(){
 if(trainMode==='topic'){
   if(!topicQuiz)topicQuiz=pick(ALL.filter(x=>x.section===topicScope));
   return trainQuestion(topicQuiz,'专题训练 · '+topicScope,'nextTopic');
 }
 if(trainMode==='comprehensive'){
   if(!comprehensiveQuiz)comprehensiveQuiz=pick(ALL_UNIQUE);
   return trainQuestion(comprehensiveQuiz,'综合训练','nextComp');
 }
 return trainingHub();
}


function render(){content.innerHTML=view==='library'?library():view==='organicmap'?organicMap():view==='network'?network():view==='training'?trainingView():library()}
function setTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));filtersR()}
function openSec(s){selected=s;view='library';filter='全部';search.value='';navR();setTabs();render();window.scrollTo({top:0,behavior:'smooth'})}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='training')trainMode='hub';setTabs();render()});
search.oninput=()=>{selected='全部';filter='全部';view='library';navR();setTabs();render()};

navR();filtersR();render();


document.addEventListener('keydown',(e)=>{
  if(view!=='training') return;
  const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  const ans=document.getElementById('ans');
  if(e.code==='Space' && ans && !ans.classList.contains('show')){
    e.preventDefault(); ans.classList.add('show');
  }else if(e.key==='Enter' && ans && ans.classList.contains('show')){
    e.preventDefault();
    if(trainMode==='topic') nextTopic();
    else if(trainMode==='comprehensive') nextComp();
  }
});


document.addEventListener('keydown',(e)=>{
  const active=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  if(e.key==='/' && active!=='input' && active!=='textarea' && active!=='select'){
    e.preventDefault(); document.body.classList.remove('sidebar-collapsed'); if(window.innerWidth<=760)openMenu(); search.focus(); search.select();
  }
  if(e.key==='Escape' && document.activeElement===search && search.value){
    search.value='';selected='全部';filter='全部';navR();filtersR();render();
  }
});


const st=document.getElementById('sideToggle');
function syncSidebarToggle(){
  if(!st)return;
  const collapsed=document.body.classList.contains('sidebar-collapsed');
  st.setAttribute('aria-label',collapsed?'展开侧边栏':'收起侧边栏');
  st.title=collapsed?'展开侧边栏':'收起侧边栏';
}
try{
  if(localStorage.getItem('chem_sidebar_collapsed')==='1' && window.innerWidth>760){
    document.body.classList.add('sidebar-collapsed');
  }
}catch(e){}
if(st){
  syncSidebarToggle();
  st.onclick=()=>{
    if(window.innerWidth<=760)return;
    document.body.classList.toggle('sidebar-collapsed');
    syncSidebarToggle();
    try{
      localStorage.setItem('chem_sidebar_collapsed',document.body.classList.contains('sidebar-collapsed')?'1':'0');
    }catch(e){}
  };
}
window.addEventListener('resize',()=>{
  if(window.innerWidth<=760 && document.body.classList.contains('sidebar-collapsed')){
    document.body.classList.remove('sidebar-collapsed');
    syncSidebarToggle();
  }
});

function openMenu(){document.body.classList.add('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','true');document.querySelector('.mobile-close').focus()}
function closeMenu(){document.body.classList.remove('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false')}
content.addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(b)openSec(b.dataset.topic)});
nav.addEventListener('click',e=>{if(e.target.closest('button'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open')){closeMenu();document.querySelector('.mobile-menu').focus()}});
window.addEventListener('resize',()=>{if(window.innerWidth>760)closeMenu()});
</script><button class="backdrop" aria-label="关闭目录" onclick="closeMenu()"></button><button class="back-top" aria-label="返回顶部" title="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button></body></html>
